<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hash IA — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A24B;
    --gold-hover: #e2b655;
    --gold-glow: rgba(201, 162, 75, 0.15);
    --bg: #09090b;
    --bg-panel: #121214;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-card: rgba(255, 255, 255, 0.05);
    --surface-hover: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.12);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.12);
    --font-heading: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; outline: none; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(201, 162, 75, 0.08) 0%, transparent 50%);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }
  a { color: var(--gold); text-decoration: none; transition: color 0.15s; }
  a:hover { color: var(--gold-hover); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(9, 9, 11, 0.8);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .brand {
    color: var(--gold);
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 22px;
    background: linear-gradient(135deg, #f0e2bf 0%, #C9A24B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  
  button {
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 10px 18px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-gold {
    background: var(--gold);
    color: #000;
  }
  .btn-gold:hover {
    background: #e2b655;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--gold-glow);
  }
  .btn-gold:active {
    transform: translateY(0);
  }
  .btn-gold:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-ghost {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-ghost:hover {
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.15);
  }
  .btn-ghost:active {
    background: var(--surface);
  }
  
  input, select, textarea {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-family: var(--font-body);
    font-size: 14px;
    transition: all 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
    background: rgba(255, 255, 255, 0.05);
  }
  input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }
  
  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  
  .card {
    background: rgba(22, 22, 26, 0.4);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s;
  }
  .card:hover {
    border-color: rgba(201, 162, 75, 0.2);
  }
  
  /* Tables styling */
  table.exp, table.tbl {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13.5px;
  }
  table.exp th, table.exp td, table.tbl th, table.tbl td {
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    transition: background 0.15s;
  }
  table.exp th, table.tbl th {
    color: var(--gold);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    background: #0f0f12;
    z-index: 10;
  }
  table.exp td.num, table.exp th.num, table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
  
  table.exp tr.exp-row:hover td, table.tbl tbody tr:hover td {
    background: var(--surface-hover);
  }
  table.exp tr.exp-row { cursor: pointer; }
  
  tfoot tr td {
    background: #0f0f12;
    border-top: 2px solid var(--border);
    font-weight: 700;
  }
  
  /* Tabs styling */
  .tabs { display: flex; gap: 6px; margin: 16px 0; overflow-x: auto; padding-bottom: 4px; }
  .tabs::-webkit-scrollbar { height: 4px; }
  .tab {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    white-space: nowrap;
  }
  .tab:hover {
    color: var(--text);
    background: var(--surface-hover);
  }
  .tab.active {
    background: var(--gold-gradient);
    color: #000;
    border-color: transparent;
    font-weight: 700;
  }
  
  .hidden { display: none !important; }
  .modal.hidden { display: none; }
  .err { color: var(--red); background: var(--red-bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; border: 1px solid rgba(239, 68, 68, 0.2); margin-top: 10px; }
  .ok { color: var(--green); background: var(--green-bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.2); margin-top: 10px; }
  .muted { color: var(--text-muted); }
  
  .scroll {
    overflow: auto;
    max-height: 64vh;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #0f0f12;
  }
  
  .emp {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .emp:last-child { border-bottom: 0; }
  .emp:hover { background: var(--surface); }
  
  /* Modals */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
    backdrop-filter: blur(16px);
    animation: fadeIn 0.2s ease-out;
  }
  .modal .box {
    background: #121215;
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 500px;
    width: 100%;
    max-height: 85vh;
    overflow: auto;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(201, 162, 75, 0.15);
    animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .detrow {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .detrow:last-child { border-bottom: 0; }
  .detrow .detk { color: var(--text-muted); }
  .detrow .detv { font-weight: 600; text-align: right; }
  
  /* Carousels & Movcards */
  .carousel {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 6px 2px 16px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .carousel::-webkit-scrollbar { height: 6px; }
  .carousel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  .carousel::-webkit-scrollbar-track { background: transparent; }
  
  .movcard {
    scroll-snap-align: start;
    flex: 0 0 240px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: all 0.2s ease;
  }
  .movcard:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.04);
    box-shadow: 0 4px 15px rgba(201, 162, 75, 0.15);
  }
  .movtipo { font-size: 10px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
  .movprov { font-family: var(--font-heading); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .movtotal { font-family: var(--font-heading); font-size: 24px; font-weight: 900; color: var(--gold); }
  .movmeta { font-size: 11.5px; color: var(--text-muted); }
  .movpago { margin-top: 4px; }
  
  /* Badges */
  .badge-ok {
    background: var(--green-bg);
    color: var(--green);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }
  .badge-no {
    background: var(--red-bg);
    color: var(--red);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }
  .flujo-tot {
    font-size: 14px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  
  /* Varas Chat styles */
  .varas-bubble-user {
    border-top-right-radius: 2px !important;
    border: 1px solid rgba(201, 162, 75, 0.2);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .varas-bubble-varas {
    border-top-left-radius: 2px !important;
    border: 1px solid var(--border);
  }
  #varasScroll {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px !important;
    background: #0f0f12;
  }
  
  /* Animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pulse-dot {
    width: 6px;
    height: 6px;
    background-color: var(--gold);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 1.4s infinite ease-in-out both;
  }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }
</style>

<body><!-- LOGIN -->
<div id="loginView" class="wrap" style="max-width:380px;">
  <h1 class="brand" style="font-size:24px; margin-top:48px;">Hash IA</h1>
  <p class="muted">Panel del dueño</p>
  <div class="card">
    <label for="email">Correo</label>
    <input id="email" type="email" style="width:100%" autocapitalize="none" />
    <label for="password" style="margin-top:10px">Contraseña</label>
    <div style="position:relative">
      <input id="password" type="password" style="width:100%; padding-right:44px" />
      <button type="button" id="togglePass" aria-label="Mostrar contraseña"
        style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; padding:4px 6px; font-size:18px">👁️</button>
    </div>
    <p id="loginErr" class="err"></p>
    <button id="loginBtn" class="btn-gold" style="width:100%; margin-top:8px">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header class="top">
    <span class="brand">Hash IA</span>
    <button id="logoutBtn" class="btn-ghost">Salir</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="gastos">Gastos</button>
      <button class="tab" data-tab="empleados">Empleados</button>
      <button class="tab" data-tab="productos">Productos</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
      <button class="tab" data-tab="contabilidad">Contabilidad</button>
      <button class="tab" data-tab="auxiliares">Auxiliares</button>
    </div>

    <!-- GASTOS -->
    <section id="gastosSection">
      <div class="card">
        <div class="row">
          <div><label>Desde</label><input id="fFrom" type="date" /></div>
          <div><label>Hasta</label><input id="fTo" type="date" /></div>
          <div><label>Categoría</label>
            <select id="fCategoria"><option value="">Todas</option></select>
          </div>
          <div><label>Estado</label>
            <select id="fEstado">
              <option value="">Todos</option>
              <option value="confirmado">Confirmado</option>
              <option value="pendiente_confirmacion">Pendiente</option>
              <option value="rechazado">Rechazado</option>
            </select>
          </div>
          <div><label>Proveedor</label><input id="fProveedor" placeholder="buscar…" /></div>
          <div><label>Tipo</label>
            <select id="fTipo">
              <option value="">Todos</option>
              <option value="gasto">Gastos</option>
              <option value="ingreso">Ingresos</option>
            </select>
          </div>
          <div><label>Período</label><input id="fPeriodo" type="month" /></div>
          <button id="mesBtn" class="btn-ghost">📅 Este mes</button>
          <button id="anioBtn" class="btn-ghost">🗓️ Este año</button>
          <button id="applyBtn" class="btn-gold">Aplicar</button>
          <button id="excelBtn" class="btn-ghost">Descargar Excel</button>
          <button id="resumenBtn" class="btn-ghost">📲 Enviarme resumen</button>
          <button id="newExpenseBtn" class="btn-gold" style="margin-left: auto;">➕ Nuevo Gasto/Ingreso</button>
        </div>
        <p id="resumenMsg" class="muted" style="margin:8px 2px 0"></p>
      </div>
      <div id="saldoCard" class="card hidden">
        <div class="row" style="gap:28px">
          <div><label>Ingresos</label><div id="sIngresos" style="font-size:20px;font-weight:900;color:#7CFC9B">$0</div></div>
          <div><label>Gastos</label><div id="sGastos" style="font-size:20px;font-weight:900;color:#ff8a8a">$0</div></div>
          <div><label>Saldo</label><div id="sSaldo" style="font-size:20px;font-weight:900;color:var(--gold)">$0</div></div>
        </div>
      </div>
      <div id="expensesTable" class="scroll"><p class="muted" style="padding:16px">Cargando…</p></div>
      <div id="detalleModal" class="modal hidden">
        <div class="box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <span class="brand" id="detalleTitulo">Detalle</span>
            <button id="detalleClose" class="btn-ghost">Cerrar</button>
          </div>
          <div id="detalleBody"></div>
          <div id="detalleActions" style="display:flex; gap:8px; margin-top:12px"></div>
        </div>
      </div>

      <!-- Modal para Crear Gasto/Ingreso Manual -->
      <div id="crearGastoModal" class="modal hidden">
        <div class="box" style="max-width:540px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px">
            <span class="brand">Nuevo Movimiento Manual</span>
            <button id="crearGastoClose" class="btn-ghost">✕</button>
          </div>
          <div class="row" style="margin-bottom:10px;">
            <div style="flex:1"><label>Tipo</label>
              <select id="cgTipo" style="width:100%"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select>
            </div>
            <div style="flex:1"><label>Categoría</label>
              <select id="cgCategoria" style="width:100%"></select>
            </div>
          </div>
          <div class="row" style="margin-bottom:10px;">
            <div style="flex:1"><label>Proveedor / Origen</label><input id="cgProveedor" style="width:100%" placeholder="ej. Soprole" /></div>
            <div style="flex:1"><label>RUT Emisor</label><input id="cgRut" style="width:100%" placeholder="77.123.456-9" /></div>
          </div>
          <div class="row" style="margin-bottom:10px;">
            <div style="flex:1"><label>Fecha</label><input id="cgFecha" type="date" style="width:100%" /></div>
            <div style="flex:1"><label>Folio (N° Doc)</label><input id="cgFolio" style="width:100%" placeholder="1234" /></div>
          </div>
          <div class="row" style="margin-bottom:10px;">
            <div style="flex:1"><label>Neto</label><input id="cgNeto" type="number" style="width:100%" placeholder="0" /></div>
            <div style="flex:1"><label>IVA</label><input id="cgIva" type="number" style="width:100%" placeholder="0" /></div>
            <div style="flex:1"><label>Total</label><input id="cgTotal" type="number" style="width:100%" placeholder="0" /></div>
          </div>
          <div class="row" style="margin-bottom:10px;">
            <div style="flex:1"><label>Glosa / Descripción</label><input id="cgGlosa" style="width:100%" placeholder="ej. Compra de insumos" /></div>
            <div style="flex:1"><label>Pago</label>
              <select id="cgPago" style="width:100%"><option value="pendiente">Pendiente</option><option value="pagada">Pagada</option></select>
            </div>
          </div>
          <p id="cgErr" class="err hidden"></p>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:14px">
            <button id="cgCancel" class="btn-ghost">Cancelar</button>
            <button id="cgSave" class="btn-gold">Guardar</button>
          </div>
        </div>
      </div>

      <!-- Modal para Editar Cuenta Contable -->
      <div id="editarCuentaModal" class="modal hidden">
        <div class="box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
            <span class="brand">Editar Cuenta</span>
            <button id="editCuentaClose" class="btn-ghost">✕</button>
          </div>
          <div>
            <label>Código</label><input id="ecCodigo" style="width:100%" />
            <label style="margin-top:8px">Nombre</label><input id="ecNombre" style="width:100%" />
            <label style="margin-top:8px">Tipo</label>
            <select id="ecTipo" style="width:100%">
              <option value="activo">Activo</option>
              <option value="pasivo">Pasivo</option>
              <option value="patrimonio">Patrimonio</option>
              <option value="resultado_ganancia">Resultado Ganancia</option>
              <option value="resultado_perdida">Resultado Pérdida</option>
            </select>
            <div style="display:flex; gap:16px; margin-top:14px">
              <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
                <input type="checkbox" id="ecImputable" />
                <span>Imputable</span>
              </label>
              <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
                <input type="checkbox" id="ecActivo" />
                <span>Activa</span>
              </label>
            </div>
          </div>
          <p id="ecErr" class="err hidden"></p>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px">
            <button id="ecCancel" class="btn-ghost">Cancelar</button>
            <button id="ecSave" class="btn-gold">Guardar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- EMPLEADOS -->
    <section id="employeesSection" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Agregar empleado</h3>
        <div class="row">
          <div><label>Nombre</label><input id="eNombre" /></div>
          <div><label>WhatsApp (E.164)</label><input id="ePhone" placeholder="569…" /></div>
          <div><label>Usuario (app)</label><input id="eUsuario" autocapitalize="none" /></div>
          <div><label>Contraseña (app)</label><input id="ePassword" type="password" /></div>
          <button id="addEmpBtn" class="btn-gold">Agregar</button>
        </div>
        <p id="empErr" class="err"></p>
      </div>
      <div id="empList" class="card"><p class="muted">Cargando…</p></div>
    </section>

    <!-- PRODUCTOS -->
    <section id="productosSection" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h3 style="margin:0;color:var(--gold)">Productos</h3>
          <button id="prodNuevo" class="btn-gold btn-sm">+ Nuevo</button>
        </div>
        <div style="display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:10px">
          <div id="prodLista" class="scroll"></div>
          <div id="prodForm" class="card" style="margin:0">
            <label>Nombre</label><input id="prodNombre" style="width:100%" />
            <div class="row" style="margin-top:8px">
              <div><label>Tipo</label>
                <select id="prodTipo"><option value="producto">Producto</option><option value="servicio">Servicio</option></select></div>
              <div><label>Categoría</label><input id="prodCategoria" /></div>
              <div><label>Precio base</label><input id="prodPrecio" type="number" /></div>
              <div><label>Stock</label><input id="prodStock" type="number" /></div>
            </div>
            <p id="prodMsg" class="ok"></p>
            <div class="row" style="justify-content:flex-end"><button id="prodGuardar" class="btn-gold">Guardar</button></div>
            <p class="muted" style="font-size:11px">Variantes y extras se editan en la app (próxima iteración del panel).</p>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTABILIDAD -->
    <section id="contabilidadSection" class="hidden">
      <div class="card">
        <div class="row">
          <div><label>Período</label><input id="cPeriodo" type="month" /></div>
          <div class="tabs" style="margin:0">
            <button class="tab csub" data-libro="varas">VARAS</button>
            <button class="tab csub active" data-libro="diario">Diario</button>
            <button class="tab csub" data-libro="mayor">Mayor</button>
            <button class="tab csub" data-libro="balance">Balance</button>
            <button class="tab csub" data-libro="flujo">Flujo de Caja</button>
            <button class="tab csub" data-libro="conciliacion">Conciliación</button>
            <button class="tab csub" data-libro="iva">IVA (SII)</button>
            <button class="tab csub" data-libro="manual">Manual</button>
            <button class="tab csub" data-libro="cuentas">Plan de Cuentas</button>
          </div>
          <button id="cExcelBtn" class="btn-ghost">Descargar Excel</button>
        </div>
      </div>
      <div id="cContenido" class="scroll" style="padding:12px"><p class="muted">Cargando…</p></div>
    </section>

    <!-- AUXILIARES -->
    <section id="auxiliaresSection" class="hidden">
      <div class="card">
        <div class="row" style="align-items:end; gap:10px; flex-wrap:wrap">
          <div style="flex:1; min-width:180px">
            <label for="auxGiroInput">Giro de la empresa</label>
            <input id="auxGiroInput" style="width:100%" placeholder="ej. pizzería, ferretería…" />
          </div>
          <button id="auxGuardarGiroBtn" class="btn-gold">Guardar giro</button>
          <button id="auxSembrarBtn" class="btn-ghost">🌱 Sembrar por rubro</button>
        </div>
        <p id="auxGiroMsg" class="muted" style="margin:6px 2px 0"></p>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Agregar insumo</h3>
        <div class="row">
          <div><label>Nombre</label><input id="auxNombre" placeholder="ej. Harina" /></div>
          <div><label>Unidad</label><input id="auxUnidad" placeholder="ej. kg" /></div>
          <button id="auxAgregarBtn" class="btn-gold">Agregar</button>
        </div>
        <p id="auxFormMsg" class="muted" style="margin:6px 2px 0"></p>
      </div>
      <div id="auxConsumo" class="card hidden" style="margin-top:10px"></div>
      <div id="auxContenido" class="scroll" style="padding:12px"><p class="muted">Cargando…</p></div>
    </section>

    <!-- AJUSTES -->
    <section id="settingsSection" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Empresa</h3>
        <div class="row">
          <div><label>Nombre</label><input id="cNombre" /></div>
          <div><label>RUT</label><input id="cRut" /></div>
          <div><label>WhatsApp del dueño</label><input id="cOwnerWa" placeholder="569…" /></div>
          <div><label>Resumen</label>
            <select id="cFreq">
              <option value="diario">Diario</option>
              <option value="semanal">Semanal</option>
              <option value="mensual">Mensual</option>
            </select>
          </div>
          <button id="saveCompanyBtn" class="btn-gold">Guardar</button>
        </div>
        <p id="settingsMsg" class="muted"></p>
      </div>
      <div class="card">
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="ivaIncluido" />
          <span>Mis precios ya incluyen IVA (el pedido muestra el total final, sin sumar 19%)</span>
        </label>
      </div>
      <div class="card">
        <h3 style="margin:0 0 8px;color:var(--gold)">Zonas de despacho</h3>
        <div id="zonasLista" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>
        <div class="row">
          <div><label>Nombre de zona</label><input id="zonaNombre" placeholder="RM cercana" /></div>
          <div><label>Costo</label><input id="zonaCosto" type="number" placeholder="2500" /></div>
          <div style="flex:1"><label>Comunas</label>
            <select id="zonaComunas" multiple size="6" style="width:100%"></select>
          </div>
          <div><button id="zonaAgregar" class="btn-gold btn-sm">+ Zona</button></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label>Envío gratis desde $</label><input id="deliveryGratis" type="number" placeholder="(opcional)" /></div>
          <div><button id="deliveryGuardar" class="btn-gold btn-sm">Guardar envío</button></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="lib.js"></script>
<script>
(function () {
  var TOKEN_KEY = 'atiko_gastos_panel_jwt';
  var CATEGORIES = [
    'Mercadería e insumos del giro','Alimentación y representación','Combustible y transporte',
    'Mantención y reparaciones','Arriendos','Servicios básicos','Útiles de oficina / generales',
    'Seguros','Publicidad y promoción','Honorarios','Contribuciones, patentes e impuestos',
    'Gastos financieros','Otros gastos'
  ];
  var $ = function (id) { return document.getElementById(id); };
  function token() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  async function apiFetch(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    var t = token();
    if (t) headers['Authorization'] = 'Bearer ' + t;
    if (opts.body && !(opts.body instanceof Blob)) headers['Content-Type'] = 'application/json';
    var res = await fetch('/api/panel' + path, { method: opts.method || 'GET', headers: headers, body: opts.body });
    if (res.status === 401) { clearToken(); showLogin(); throw new Error('401'); }
    return res;
  }

  function showLogin() { $('loginView').classList.remove('hidden'); $('appView').classList.add('hidden'); }
  function ymActual() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function showApp() { $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); if (!$('fPeriodo').value) $('fPeriodo').value = ymActual(); loadGastos(); }

  $('loginBtn').onclick = async function () {
    $('loginErr').textContent = '';
    try {
      var res = await fetch('/api/panel/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value, password: $('password').value })
      });
      if (!res.ok) throw new Error('bad');
      var data = await res.json();
      setToken(data.token);
      showApp();
    } catch (e) { $('loginErr').textContent = 'Correo o contraseña incorrectos.'; }
  };
  $('logoutBtn').onclick = function () { clearToken(); showLogin(); };
  $('togglePass').onclick = function () {
    var p = $('password');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('togglePass').textContent = show ? '🙈' : '👁️';
  };

  var tabs = document.querySelectorAll('.tab[data-tab]');
  tabs.forEach(function (b) {
    b.onclick = function () {
      tabs.forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      var tab = b.getAttribute('data-tab');
      $('gastosSection').classList.toggle('hidden', tab !== 'gastos');
      $('employeesSection').classList.toggle('hidden', tab !== 'empleados');
      $('productosSection').classList.toggle('hidden', tab !== 'productos');
      $('settingsSection').classList.toggle('hidden', tab !== 'ajustes');
      $('contabilidadSection').classList.toggle('hidden', tab !== 'contabilidad');
      $('auxiliaresSection').classList.toggle('hidden', tab !== 'auxiliares');
      if (tab === 'empleados') loadEmpleados();
      if (tab === 'ajustes') loadCompany();
      if (tab === 'productos') cargarProductos();
      if (tab === 'contabilidad') { if (!$('cPeriodo').value) $('cPeriodo').value = ymActual(); loadContabilidad(); }
      if (tab === 'auxiliares') loadAuxiliares();
    };
  });

  CATEGORIES.forEach(function (c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c; $('fCategoria').appendChild(o);
  });

  function currentFilters() {
    return { from: $('fFrom').value, to: $('fTo').value, periodo: $('fPeriodo').value,
             tipo: $('fTipo').value, categoria: $('fCategoria').value,
             estado: $('fEstado').value, proveedor: $('fProveedor').value };
  }
  var lastRows = [];
  async function loadGastos() {
    $('expensesTable').innerHTML = '<p class="muted" style="padding:16px">Cargando…</p>';
    try {
      var res = await apiFetch('/expenses' + PanelLib.buildQuery(currentFilters()));
      var rows = await res.json();
      lastRows = rows;
      renderSaldo(rows);
      $('expensesTable').innerHTML = rows.length ? PanelLib.expensesTableHtml(rows)
        : '<p class="muted" style="padding:16px">Sin movimientos para esos filtros.</p>';
      wirePayButtons();
      wireRowClicks();
    } catch (e) { if (e.message !== '401') $('expensesTable').innerHTML = '<p class="err" style="padding:16px">Error al cargar.</p>'; }
  }
  function wireRowClicks() {
    $('expensesTable').querySelectorAll('tr.exp-row').forEach(function (tr) {
      tr.onclick = function (ev) {
        if (ev.target.closest && ev.target.closest('[data-pay]')) return; // no abrir si tocó "Marcar pagada"
        var id = tr.getAttribute('data-id');
        var row = lastRows.filter(function (r) { return String(r.id) === id; })[0];
        if (row) openDetalle(row);
      };
    });
  }
  var detSel = null;
  function openDetalle(row) {
    detSel = row;
    $('detalleTitulo').textContent = (row.tipo === 'ingreso' ? 'Ingreso' : 'Gasto') + ' · ' + PanelLib.fmtClp(row.total);
    $('detalleBody').innerHTML = PanelLib.detalleHtml(row);
    defaultActions();
    $('detalleModal').classList.remove('hidden');
  }
  function closeDetalle() { $('detalleModal').classList.add('hidden'); $('detalleActions').innerHTML = ''; }
  function defaultActions() {
    $('detalleActions').innerHTML = '<button id="detFotoBtn" class="btn-ghost" style="flex:1">📷 Ver foto</button>'
      + '<button id="detEditBtn" class="btn-ghost" style="flex:1">✏️ Editar</button>'
      + '<button id="detAnularBtn" class="btn-ghost" style="flex:1; color:#ff8a8a">🗑️ Anular</button>';
    $('detFotoBtn').onclick = onFoto;
    $('detEditBtn').onclick = onEdit;
    $('detAnularBtn').onclick = onAnular;
  }
  async function onFoto() {
    if (!detSel) return;
    try {
      var res = await apiFetch('/expenses/' + detSel.id + '/foto');
      if (!res.ok) { $('detalleBody').insertAdjacentHTML('afterbegin', '<div class="muted" style="margin-bottom:8px">Sin foto disponible (se guarda 2 meses y luego se elimina).</div>'); $('detFotoBtn').disabled = true; return; }
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      $('detalleBody').insertAdjacentHTML('afterbegin', '<img alt="factura" src="' + url + '" style="width:100%; max-height:340px; object-fit:contain; border-radius:10px; background:#0008; margin-bottom:10px" />');
      $('detFotoBtn').disabled = true;
    } catch (e) {}
  }
  function fld(id, label, value, type) {
    return '<label class="muted" style="display:block; margin-top:8px">' + label + '</label>'
      + '<input id="' + id + '" ' + (type ? 'type="' + type + '" ' : '') + 'style="width:100%" value="' + PanelLib.escapeHtml(value == null ? '' : value) + '" />';
  }
  function onEdit() {
    var e = detSel; if (!e) return;
    var esIngreso = e.tipo === 'ingreso';
    var catOpts = '<option value="">—</option>' + CATEGORIES.map(function (c) {
      return '<option value="' + PanelLib.escapeHtml(c) + '"' + (c === e.categoria ? ' selected' : '') + '>' + PanelLib.escapeHtml(c) + '</option>';
    }).join('');
    $('detalleBody').innerHTML = ''
      + '<label class="muted" style="display:block">Tipo</label>'
      + '<select id="edTipo" style="width:100%"><option value="gasto"' + (esIngreso ? '' : ' selected') + '>Gasto</option><option value="ingreso"' + (esIngreso ? ' selected' : '') + '>Ingreso</option></select>'
      + fld('edProveedor', esIngreso ? 'Pagador / origen' : 'Proveedor', e.proveedor)
      + fld('edTotal', 'Monto', e.total, 'number')
      + fld('edFecha', 'Fecha (aaaa-mm-dd)', e.fecha ? String(e.fecha).slice(0, 10) : '')
      + '<label class="muted" style="display:block; margin-top:8px">Categoría</label><select id="edCategoria" style="width:100%">' + catOpts + '</select>'
      + fld('edFolio', 'Folio (N° doc)', e.folio)
      + fld('edNroOp', 'N° operación', e.nro_operacion);
    $('detalleActions').innerHTML = '<button id="edSave" class="btn-gold" style="flex:1">Guardar</button><button id="edCancel" class="btn-ghost" style="flex:1">Cancelar</button>';
    $('edSave').onclick = async function () {
      var patch = { tipo: $('edTipo').value, proveedor: $('edProveedor').value, total: Number($('edTotal').value) || 0,
        fecha: $('edFecha').value || null, categoria: $('edCategoria').value, folio: $('edFolio').value, nro_operacion: $('edNroOp').value };
      try { await apiFetch('/expenses/' + e.id, { method: 'PATCH', body: JSON.stringify(patch) }); closeDetalle(); loadGastos(); } catch (err) {}
    };
    $('edCancel').onclick = function () { openDetalle(e); };
  }
  function onAnular() {
    $('detalleActions').innerHTML = '<span style="flex:1; font-size:13px; align-self:center">¿Anular este movimiento? (queda el registro)</span>'
      + '<button id="anYes" class="btn-ghost" style="color:#ff8a8a">Sí, anular</button><button id="anNo" class="btn-ghost">No</button>';
    $('anYes').onclick = async function () {
      try { await apiFetch('/expenses/' + detSel.id + '/anular', { method: 'POST', body: JSON.stringify({}) }); closeDetalle(); loadGastos(); } catch (err) {}
    };
    $('anNo').onclick = function () { openDetalle(detSel); };
  }
  $('detalleClose').onclick = closeDetalle;
  $('detalleModal').onclick = function (ev) { if (ev.target === $('detalleModal')) closeDetalle(); };
  function renderSaldo(rows) {
    var c = PanelLib.cashflowFromRows(rows);
    $('sIngresos').textContent = PanelLib.fmtClp(c.ingresos);
    $('sGastos').textContent = PanelLib.fmtClp(c.gastos);
    $('sSaldo').textContent = PanelLib.fmtClp(c.saldo);
    $('saldoCard').classList.toggle('hidden', !rows.length);
  }
  function wirePayButtons() {
    $('expensesTable').querySelectorAll('[data-pay]').forEach(function (b) {
      b.onclick = async function () {
        b.disabled = true;
        try { await apiFetch('/expenses/' + b.getAttribute('data-pay') + '/pagar', { method: 'PATCH' }); loadGastos(); }
        catch (e) { b.disabled = false; }
      };
    });
  }
  $('applyBtn').onclick = loadGastos;

  // ── NUEVO MOVIMIENTO MANUAL ──
  $('newExpenseBtn').onclick = function () {
    $('cgTipo').value = 'gasto';
    $('cgCategoria').innerHTML = '<option value="">— Seleccionar —</option>' + CATEGORIES.map(function (c) {
      return '<option value="' + PanelLib.escapeHtml(c) + '">' + PanelLib.escapeHtml(c) + '</option>';
    }).join('');
    $('cgProveedor').value = '';
    $('cgRut').value = '';
    var hoy = new Date();
    $('cgFecha').value = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
    $('cgFolio').value = '';
    $('cgNeto').value = '';
    $('cgIva').value = '';
    $('cgTotal').value = '';
    $('cgGlosa').value = '';
    $('cgPago').value = 'pendiente';
    $('cgErr').classList.add('hidden');
    $('crearGastoModal').classList.remove('hidden');
  };

  $('crearGastoClose').onclick = $('cgCancel').onclick = function () {
    $('crearGastoModal').classList.add('hidden');
  };

  $('crearGastoModal').onclick = function (ev) {
    if (ev.target === $('crearGastoModal')) $('crearGastoModal').classList.add('hidden');
  };

  // Auto-calcular IVA sobre neto
  $('cgNeto').oninput = function () {
    var neto = Number($('cgNeto').value) || 0;
    var iva = Math.round(neto * 0.19);
    $('cgIva').value = iva;
    $('cgTotal').value = neto + iva;
  };

  // Auto-calcular neto e IVA sobre total
  $('cgTotal').oninput = function () {
    var total = Number($('cgTotal').value) || 0;
    var neto = Math.round(total / 1.19);
    $('cgIva').value = total - neto;
    $('cgNeto').value = neto;
  };

  $('cgSave').onclick = async function () {
    var tipo = $('cgTipo').value;
    var total = Number($('cgTotal').value);
    if (!tipo || isNaN(total) || total === 0) {
      $('cgErr').textContent = 'El tipo y el monto total son requeridos.';
      $('cgErr').classList.remove('hidden');
      return;
    }
    $('cgSave').disabled = true;
    $('cgErr').classList.add('hidden');
    try {
      var body = {
        tipo: tipo,
        categoria: $('cgCategoria').value || null,
        proveedor: $('cgProveedor').value.trim() || null,
        rut_emisor: $('cgRut').value.trim() || null,
        fecha: $('cgFecha').value || null,
        folio: $('cgFolio').value.trim() || null,
        neto: Number($('cgNeto').value) || 0,
        iva: Number($('cgIva').value) || 0,
        total: total,
        glosa: $('cgGlosa').value.trim() || null,
        estado_pago: $('cgPago').value
      };
      var res = await apiFetch('/expenses/manual', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('fail');
      $('crearGastoModal').classList.add('hidden');
      loadGastos();
    } catch (e) {
      $('cgErr').textContent = 'Error al guardar el movimiento.';
      $('cgErr').classList.remove('hidden');
    } finally {
      $('cgSave').disabled = false;
    }
  };
  $('mesBtn').onclick = function () {
    $('fFrom').value = ''; $('fTo').value = ''; $('fPeriodo').value = ymActual(); loadGastos();
  };
  $('anioBtn').onclick = function () {
    var y = new Date().getFullYear();
    $('fPeriodo').value = ''; $('fFrom').value = y + '-01-01'; $('fTo').value = y + '-12-31'; loadGastos();
  };
  $('excelBtn').onclick = async function () {
    try {
      var res = await apiFetch('/expenses.xlsx' + PanelLib.buildQuery(currentFilters()));
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'gastos.xlsx';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch (e) {}
  };
  $('resumenBtn').onclick = async function () {
    $('resumenBtn').disabled = true;
    $('resumenMsg').textContent = 'Enviando resumen por WhatsApp…';
    try {
      var body = {};
      if ($('fPeriodo').value) body.periodo = $('fPeriodo').value;
      var res = await apiFetch('/whatsapp/resumen', { method: 'POST', body: JSON.stringify(body) });
      var d = await res.json().catch(function () { return {}; });
      if (res.ok) { $('resumenMsg').textContent = '✓ Resumen enviado a tu WhatsApp (' + (d.to || '') + ').'; }
      else if (d.error === 'whatsapp_no_configurado') { $('resumenMsg').textContent = 'Falta configurar el WhatsApp de la empresa.'; }
      else { $('resumenMsg').textContent = 'No se pudo enviar. Escríbele "hola" a tu número de WhatsApp para abrir la ventana de 24h y reintenta.'; }
    } catch (e) { if (e.message !== '401') $('resumenMsg').textContent = 'Error al enviar.'; }
    $('resumenBtn').disabled = false;
  };

  async function loadEmpleados() {
    $('empList').innerHTML = '<p class="muted">Cargando…</p>';
    try {
      var res = await apiFetch('/employees');
      var emps = await res.json();
      $('empList').innerHTML = emps.length ? emps.map(function (e) {
        return '<div class="emp"><div><b>' + PanelLib.escapeHtml(e.nombre) + '</b> '
          + '<span class="muted">' + PanelLib.escapeHtml(e.usuario || '') + ' · ' + PanelLib.escapeHtml(e.phone || '') + '</span></div>'
          + '<button class="btn-ghost" data-del="' + e.id + '">' + (e.activo ? 'Desactivar' : 'Inactivo') + '</button></div>';
      }).join('') : '<p class="muted">Sin empleados.</p>';
      $('empList').querySelectorAll('[data-del]').forEach(function (b) {
        b.onclick = async function () {
          await apiFetch('/employees/' + b.getAttribute('data-del'), { method: 'DELETE' });
          loadEmpleados();
        };
      });
    } catch (e) {}
  }
  $('addEmpBtn').onclick = async function () {
    $('empErr').textContent = '';
    try {
      var res = await apiFetch('/employees', { method: 'POST', body: JSON.stringify({
        nombre: $('eNombre').value, phone: $('ePhone').value, usuario: $('eUsuario').value, password: $('ePassword').value }) });
      if (!res.ok) throw new Error('bad');
      $('eNombre').value = $('ePhone').value = $('eUsuario').value = $('ePassword').value = '';
      loadEmpleados();
    } catch (e) { $('empErr').textContent = 'Falta el nombre (mínimo).'; }
  };

  async function loadCompany() {
    try {
      var res = await apiFetch('/company');
      var c = await res.json();
      $('cNombre').value = c.nombre || ''; $('cRut').value = c.rut || '';
      $('cOwnerWa').value = c.owner_whatsapp || ''; $('cFreq').value = c.resumen_frecuencia || 'mensual';
    } catch (e) {}
    try { var r = await apiFetch('/pedido-config'); var cfg = await r.json(); var el = $('ivaIncluido'); if (el) el.checked = cfg.iva_incluido !== false; } catch (e) {}
    loadDelivery();
  }

  var _zonas = [];
  async function loadDelivery() {
    try {
      var cr = await apiFetch('/comunas'); var regs = await cr.json();
      var sel = $('zonaComunas');
      if (sel && !sel.dataset.loaded) {
        sel.innerHTML = regs.map(function (g) {
          return '<optgroup label="' + PanelLib.escapeHtml(g.region) + '">' + g.comunas.map(function (c) {
            return '<option value="' + PanelLib.escapeHtml(c) + '">' + PanelLib.escapeHtml(c) + '</option>';
          }).join('') + '</optgroup>';
        }).join('');
        sel.dataset.loaded = '1';
      }
      var pr = await apiFetch('/pedido-config'); var cfg = await pr.json();
      _zonas = (cfg.delivery && cfg.delivery.zonas) || [];

        ind.textContent = 'Debe $' + c.sumD.toLocaleString('es-CL') + ' · Haber $' + c.sumH.toLocaleString('es-CL') + (c.cuadrado ? ' ✓ cuadra' : ' ⚠ no cuadra');

        });
        cont.querySelectorAll('[data-fh]').forEach(function (el) {

  // ── VARAS (chat conversacional) ───────────────────────────────────────────
  var VARAS_BIENVENIDA = 'Soy VARAS, tu controlador financiero. Pregúntame por tus saldos, deudas, flujo o consumo de insumos.';
  var _varasMensajes = null;
  var _varasAccion = null;
  var _varasBusy = false;

  async function varasChat(messages) {
    var res = await apiFetch('/varas/chat', { method: 'POST', body: JSON.stringify({ messages: messages }) });
    if (!res.ok) throw new Error('varas-chat');
    return res.json();
  }
  async function varasAccion(tipo, args) {
    var res = await apiFetch('/varas/accion', { method: 'POST', body: JSON.stringify({ tipo: tipo, args: args }) });
    if (!res.ok) throw new Error('varas-accion');
    return res.json();
  }

  function renderVarasChat() {
    if (!_varasMensajes) _varasMensajes = [{ role: 'varas', text: VARAS_BIENVENIDA }];
    $('cContenido').innerHTML =
      '<div style="max-width:680px;display:flex;flex-direction:column;height:100%">'
      + '<div id="varasScroll" class="scroll" style="flex:1;min-height:200px;padding:4px"></div>'
      + '<div class="row" style="margin-top:8px;gap:8px">'
      + '<input id="varasInput" style="flex:1" placeholder="Pregúntale a VARAS…" />'
      + '<button id="varasEnviar" class="btn-gold">Enviar</button>'
      + '</div></div>';

    function pintar() {
      var cont = $('varasScroll');
      if (!cont) return;
      var msgs = _varasMensajes.slice();
      if (_varasBusy) {
        msgs.push({ role: 'varas', text: '', loading: true });
      }
      cont.innerHTML = PanelLib.varasChatHtml(msgs, _varasAccion);
      cont.scrollTop = cont.scrollHeight;
      var conf = $('varas-confirmar');
      if (conf) conf.onclick = confirmar;
      var canc = $('varas-cancelar');
      if (canc) canc.onclick = function () { _varasAccion = null; pintar(); };
    }

    async function enviar() {
      var inp = $('varasInput');
      var texto = (inp && inp.value || '').trim();
      if (!texto || _varasBusy) return;
      _varasMensajes.push({ role: 'user', text: texto });
      _varasAccion = null;
      _varasBusy = true;
      if (inp) inp.value = '';
      pintar();
      try {
        var historial = _varasMensajes.map(function (m) { return { role: m.role === 'varas' ? 'assistant' : 'user', text: m.text }; });
        var r = await varasChat(historial);
        _varasMensajes.push({ role: 'varas', text: (r && r.reply) || '' });
        if (r && r.accionPropuesta) _varasAccion = r.accionPropuesta;
      } catch (e) {
        if (e.message !== '401') _varasMensajes.push({ role: 'varas', text: 'No pude procesar eso, intenta de nuevo.' });
      } finally {
        _varasBusy = false;
        pintar();
      }
    }

    async function confirmar() {
      if (!_varasAccion || _varasBusy) return;
      _varasBusy = true;
      var acc = _varasAccion;
      try {
        await varasAccion(acc.tipo, acc.args);
        _varasMensajes.push({ role: 'varas', text: '✓ Hecho.' });
        _varasAccion = null;
      } catch (e) {
        if (e.message !== '401') _varasMensajes.push({ role: 'varas', text: 'No pude ejecutar la acción, intenta de nuevo.' });
      } finally {
        _varasBusy = false;
        pintar();
      }
    }

    pintar();
    var btn = $('varasEnviar');
    if (btn) btn.onclick = enviar;
    var inp = $('varasInput');
    if (inp) inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); enviar(); } };
  }

  async function loadCuentasTabla() {
    var container = $('cuentasTablaContenedor');
    if (!container) return;
    container.innerHTML = '<p class="muted" style="padding:16px">Cargando cuentas…</p>';
    _cuentasCache = null; // force reload
    try {
      var cuentas = await getCuentas();
      container.innerHTML = PanelLib.cuentasTableHtml(cuentas);
      wireCuentaActions(cuentas);
    } catch (e) {
      container.innerHTML = '<p class="err" style="padding:16px">Error al cargar cuentas.</p>';

  function wireCuentaActions(cuentas) {
    var cont = $('cuentasTablaContenedor');
    if (!cont) return;
    cont.querySelectorAll('.cta-edit').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-id');
        var c = cuentas.filter(function (x) { return String(x.id) === id; })[0];
        if (!c) return;
        editingCuentaId = c.id;
        $('ecCodigo').value = c.codigo || '';
        $('ecNombre').value = c.nombre || '';
        $('ecTipo').value = c.tipo || 'activo';
        $('ecImputable').checked = !!c.imputable;
        $('ecActivo').checked = !!c.activo;
        $('ecErr').classList.add('hidden');
        $('editarCuentaModal').classList.remove('hidden');
      };
    });

    cont.querySelectorAll('.cta-del').forEach(function (btn) {
      btn.onclick = async function () {
        var id = btn.getAttribute('data-id');
        if (!confirm('¿Desactivar esta cuenta? Las transacciones que la usen seguirán existiendo, pero no estará disponible para nuevos asientos.')) return;
        btn.disabled = true;
        try {
          var res = await apiFetch('/cuentas/' + id, { method: 'DELETE' });
          if (!res.ok) throw new Error('fail');
          _cuentasCache = null; // Invalidate cache
          loadCuentasTabla();
        } catch (e) {
          btn.disabled = false;
          alert('No se pudo desactivar la cuenta.');
        }
      };
    });
  }

  async function loadContabilidad() {
    $('cContenido').innerHTML = '<p class="muted" style="padding:8px">Cargando…</p>';
    $('cExcelBtn').classList.toggle('hidden', libroActual === 'varas' || libroActual === 'conciliacion' || libroActual === 'iva' || libroActual === 'manual' || libroActual === 'cuentas');
    var p = '?periodo=' + encodeURIComponent(cPeriodoVal());
    try {
      var res, data;
      if (libroActual === 'varas') {
        renderVarasChat();
        return;
      } else if (libroActual === 'manual') {
        renderManualForm();
        return;
      } else if (libroActual === 'diario') {
        res = await apiFetch('/contabilidad/diario' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.diarioTableHtml(data.asientos);
        $('cContenido').querySelectorAll('[data-anular]').forEach(function (btn) {
          btn.onclick = async function () {
            if (!confirm('¿Anular este asiento? (quedará registrado como anulado)')) return;
            btn.disabled = true;
            try {
              var ar = await apiFetch('/asientos/' + btn.getAttribute('data-anular') + '/anular', { method: 'POST', body: JSON.stringify({}) });
              if (!ar.ok) throw new Error('fail');
              loadContabilidad();
            } catch (e) { btn.disabled = false; alert('No se pudo anular.'); }
          };
        });
      } else if (libroActual === 'mayor') {
        res = await apiFetch('/contabilidad/mayor' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.mayorTableHtml(data.cuentas);
      } else if (libroActual === 'balance') {
        res = await apiFetch('/contabilidad/balance' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.balanceTableHtml(data);
      } else if (libroActual === 'conciliacion') {
        res = await apiFetch('/contabilidad/conciliacion');
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.conciliacionHtml(data && data.conciliacion === null ? null : data);
      } else if (libroActual === 'iva') {
        res = await apiFetch('/contabilidad/conciliacion?tipo=sii');
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.ivaResumenHtml(data && data.conciliacion === null ? null : data);
      } else if (libroActual === 'cuentas') {
        loadCuentasCRUD();
        return;
      } else {
        res = await apiFetch('/contabilidad/flujo' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.flujoTableHtml(data);
      }
    } catch (e) {
      if (e.message !== '401') $('cContenido').innerHTML = '<p class="err" style="padding:8px">No se pudo cargar.</p>';

  $('cExcelBtn').onclick = async function () {
    var p = '?periodo=' + encodeURIComponent(cPeriodoVal());
    try {
      var res = await fetch('/api/panel/contabilidad/' + libroActual + '.xlsx' + p,
        { headers: { 'Authorization': 'Bearer ' + token() } });
      if (!res.ok) return;
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = libroActual + '.xlsx';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch (e) {}
  };

  // ── AUXILIARES ────────────────────────────────────────────────────────────
  async function loadAuxiliares() {
    $('auxContenido').innerHTML = '<p class="muted" style="padding:8px">Cargando…</p>';
    try {
      var gr = await apiFetch('/giro');
      var gd = await gr.json();
      $('auxGiroInput').value = gd.giro || '';
    } catch (e) {}
    try {
      var res = await apiFetch('/auxiliares');
      var data = await res.json();
      $('auxConsumo').classList.add('hidden');
      $('auxConsumo').innerHTML = '';
      $('auxContenido').innerHTML = PanelLib.auxiliaresTableHtml(data.auxiliares);
      $('auxContenido').querySelectorAll('.aux-del').forEach(function (b) {
        b.onclick = async function () {
          b.disabled = true;
          try {
            await apiFetch('/auxiliares/' + b.getAttribute('data-aux') + '/desactivar', { method: 'POST', body: JSON.stringify({}) });
            loadAuxiliares();
          } catch (e) { b.disabled = false; }
        };
      });
      $('auxContenido').querySelectorAll('tr[data-aux]').forEach(function (tr) {
        tr.style.cursor = 'pointer';
        tr.onclick = async function (ev) {
          if (ev.target.closest && ev.target.closest('.aux-del')) return;
          var id = tr.getAttribute('data-aux');
          var nombre = tr.getAttribute('data-nombre') || '';
          $('auxConsumo').innerHTML = '<p class="muted" style="padding:8px">Cargando consumo…</p>';
          $('auxConsumo').classList.remove('hidden');
          try {
            var res = await apiFetch('/auxiliares/' + id + '/consumo');
            var consumo = await res.json();
            $('auxConsumo').innerHTML = PanelLib.consumoHtml(consumo, nombre);
          } catch (e) {
            if (e.message !== '401') $('auxConsumo').innerHTML = '<p class="err" style="padding:8px">No se pudo cargar el consumo.</p>';
          }
        };
      });
    } catch (e) {
      if (e.message !== '401') $('auxContenido').innerHTML = '<p class="err" style="padding:8px">Error al cargar.</p>';
    }
  }

  $('auxGuardarGiroBtn').onclick = async function () {
    $('auxGiroMsg').textContent = '';
    try {
      await apiFetch('/giro', { method: 'PATCH', body: JSON.stringify({ giro: $('auxGiroInput').value.trim() }) });
      $('auxGiroMsg').textContent = 'Giro guardado ✓';
    } catch (e) { $('auxGiroMsg').textContent = 'No se pudo guardar.'; }
  };

  $('auxSembrarBtn').onclick = async function () {
    $('auxGiroMsg').textContent = 'Sembrando…';
    $('auxSembrarBtn').disabled = true;
    try {
      var res = await apiFetch('/auxiliares/sembrar', { method: 'POST', body: JSON.stringify({ giro: $('auxGiroInput').value.trim() || undefined }) });
      var d = await res.json();
      $('auxGiroMsg').textContent = 'Sembrados ' + (d.creados || 0) + ' insumos ✓';
      loadAuxiliares();
    } catch (e) { $('auxGiroMsg').textContent = 'Error al sembrar.'; }
    $('auxSembrarBtn').disabled = false;
  };

  $('auxAgregarBtn').onclick = async function () {
    $('auxFormMsg').textContent = '';
    var nombre = $('auxNombre').value.trim();
    if (!nombre) { $('auxFormMsg').textContent = 'Falta el nombre.'; return; }
    try {
      var res = await apiFetch('/auxiliares', { method: 'POST', body: JSON.stringify({ nombre: nombre, unidad_principal: $('auxUnidad').value.trim() || undefined }) });
      if (!res.ok) throw new Error('bad');
      $('auxNombre').value = ''; $('auxUnidad').value = '';
      $('auxFormMsg').textContent = 'Insumo agregado ✓';
      loadAuxiliares();
    } catch (e) { $('auxFormMsg').textContent = 'Error al agregar.'; }
  };

  if (token()) showApp(); else showLogin();
})();
</script>
</body>
</html>
