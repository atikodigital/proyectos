<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hash IA — Panel</title>
<style>
  :root { --gold:#C9A24B; --bg:#0E0E0E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#fff; font-family:system-ui,Segoe UI,sans-serif; }
  a { color:var(--gold); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  header.top { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #ffffff1a; }
  .brand { color:var(--gold); font-weight:900; font-size:18px; }
  button { cursor:pointer; border:0; border-radius:10px; padding:10px 14px; font-weight:800; }
  .btn-gold { background:var(--gold); color:#000; }
  .btn-ghost { background:#ffffff14; color:#fff; }
  input, select { background:#ffffff10; color:#fff; border:1px solid #ffffff26; border-radius:10px; padding:9px 11px; }
  label { font-size:12px; opacity:.8; display:block; margin-bottom:3px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .card { background:#ffffff08; border:1px solid #ffffff14; border-radius:14px; padding:14px; margin:12px 0; }
  table.exp { width:100%; border-collapse:collapse; font-size:13px; }
  table.exp th, table.exp td { text-align:left; padding:8px 10px; border-bottom:1px solid #ffffff12; white-space:nowrap; }
  table.exp th { color:var(--gold); position:sticky; top:0; background:#161616; }
  table.exp td.num, table.exp th.num { text-align:right; }
  .tabs { display:flex; gap:8px; margin:12px 0; }
  .tab { background:#ffffff10; }
  .tab.active { background:var(--gold); color:#000; }
  .hidden { display:none; }
  .err { color:#ff6b6b; font-size:13px; }
  .muted { opacity:.6; }
  .scroll { overflow:auto; max-height:62vh; border:1px solid #ffffff12; border-radius:12px; }
  .emp { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-bottom:1px solid #ffffff12; }
  table.exp tr.exp-row { cursor:pointer; }
  table.exp tr.exp-row:hover td { background:#ffffff0a; }
  .modal { position:fixed; inset:0; background:#000000cc; display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.hidden { display:none; }
  .modal .box { background:#161616; border:1px solid #ffffff22; border-radius:14px; max-width:480px; width:100%; max-height:85vh; overflow:auto; padding:16px; }
  .detrow { display:flex; justify-content:space-between; gap:12px; padding:8px 4px; border-bottom:1px solid #ffffff12; font-size:14px; }
  .detrow .detk { opacity:.6; } .detrow .detv { font-weight:700; text-align:right; }
  .carousel { display:flex; gap:12px; overflow-x:auto; padding:6px 2px 16px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
  .carousel::-webkit-scrollbar { height:9px; } .carousel::-webkit-scrollbar-thumb { background:#ffffff26; border-radius:5px; } .carousel::-webkit-scrollbar-track { background:#ffffff0a; }
  .movcard { scroll-snap-align:start; flex:0 0 230px; background:#ffffff08; border:1px solid #ffffff1a; border-radius:16px; padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; transition:border-color .15s, transform .15s; }
  .movcard:hover { border-color:var(--gold); transform:translateY(-2px); }
  .movtipo { font-size:11px; font-weight:900; letter-spacing:.08em; }
  .movprov { font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .movtotal { font-size:23px; font-weight:900; color:var(--gold); }
  .movmeta { font-size:12px; opacity:.7; }
  .movpago { margin-top:6px; }
</style>
<!-- Meta Pixel - Atiko Digital -->
<script>window.ATIKO_META_PIXEL_ID='1768028951050353';</script>
<script src="https://atikodigital.cl/assets/meta-pixel.js" async crossorigin="anonymous"></script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1768028951050353&ev=PageView&noscript=1"/></noscript>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="wrap" style="max-width:380px;">
  <h1 class="brand" style="font-size:24px; margin-top:48px;">Hash IA</h1>
  <p class="muted">Panel del dueño</p>
  <div class="card">
    <label for="email">Correo</label>
    <input id="email" type="email" style="width:100%" autocapitalize="none" />
    <label for="password" style="margin-top:10px">Contraseña</label>
    <div style="position:relative">
      <input id="password" type="password" style="width:100%; padding-right:44px" />
      <button type="button" id="togglePass" aria-label="Mostrar contraseña"
        style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; padding:4px 6px; font-size:18px">👁️</button>
    </div>
    <p id="loginErr" class="err"></p>
    <button id="loginBtn" class="btn-gold" style="width:100%; margin-top:8px">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header class="top">
    <span class="brand">Hash IA</span>
    <button id="logoutBtn" class="btn-ghost">Salir</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="gastos">Gastos</button>
      <button class="tab" data-tab="empleados">Empleados</button>
      <button class="tab" data-tab="productos">Productos</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
      <button class="tab" data-tab="contabilidad">Contabilidad</button>
      <button class="tab" data-tab="auxiliares">Auxiliares</button>
    </div>

    <!-- GASTOS -->
    <section id="gastosSection">
      <div class="card">
        <div class="row">
          <div><label>Desde</label><input id="fFrom" type="date" /></div>
          <div><label>Hasta</label><input id="fTo" type="date" /></div>
          <div><label>Categoría</label>
            <select id="fCategoria"><option value="">Todas</option></select>
          </div>
          <div><label>Estado</label>
            <select id="fEstado">
              <option value="">Todos</option>
              <option value="confirmado">Confirmado</option>
              <option value="pendiente_confirmacion">Pendiente</option>
              <option value="rechazado">Rechazado</option>
            </select>
          </div>
          <div><label>Proveedor</label><input id="fProveedor" placeholder="buscar…" /></div>
          <div><label>Tipo</label>
            <select id="fTipo">
              <option value="">Todos</option>
              <option value="gasto">Gastos</option>
              <option value="ingreso">Ingresos</option>
            </select>
          </div>
          <div><label>Período</label><input id="fPeriodo" type="month" /></div>
          <button id="mesBtn" class="btn-ghost">📅 Este mes</button>
          <button id="anioBtn" class="btn-ghost">🗓️ Este año</button>
          <button id="applyBtn" class="btn-gold">Aplicar</button>
          <button id="excelBtn" class="btn-ghost">Descargar Excel</button>
          <button id="resumenBtn" class="btn-ghost">📲 Enviarme resumen</button>
        </div>
        <p id="resumenMsg" class="muted" style="margin:8px 2px 0"></p>
      </div>
      <div id="saldoCard" class="card hidden">
        <div class="row" style="gap:28px">
          <div><label>Ingresos</label><div id="sIngresos" style="font-size:20px;font-weight:900;color:#7CFC9B">$0</div></div>
          <div><label>Gastos</label><div id="sGastos" style="font-size:20px;font-weight:900;color:#ff8a8a">$0</div></div>
          <div><label>Saldo</label><div id="sSaldo" style="font-size:20px;font-weight:900;color:var(--gold)">$0</div></div>
        </div>
      </div>
      <div id="expensesTable" class="scroll"><p class="muted" style="padding:16px">Cargando…</p></div>
      <div id="detalleModal" class="modal hidden">
        <div class="box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <span class="brand" id="detalleTitulo">Detalle</span>
            <button id="detalleClose" class="btn-ghost">Cerrar</button>
          </div>
          <div id="detalleBody"></div>
          <div id="detalleActions" style="display:flex; gap:8px; margin-top:12px"></div>
        </div>
      </div>
    </section>

    <!-- EMPLEADOS -->
    <section id="employeesSection" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Agregar empleado</h3>
        <div class="row">
          <div><label>Nombre</label><input id="eNombre" /></div>
          <div><label>WhatsApp (E.164)</label><input id="ePhone" placeholder="569…" /></div>
          <div><label>Usuario (app)</label><input id="eUsuario" autocapitalize="none" /></div>
          <div><label>Contraseña (app)</label><input id="ePassword" type="password" /></div>
          <button id="addEmpBtn" class="btn-gold">Agregar</button>
        </div>
        <p id="empErr" class="err"></p>
      </div>
      <div id="empList" class="card"><p class="muted">Cargando…</p></div>
    </section>

    <!-- PRODUCTOS -->
    <section id="productosSection" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h3 style="margin:0;color:var(--gold)">Productos</h3>
          <button id="prodNuevo" class="btn-gold btn-sm">+ Nuevo</button>
        </div>
        <div style="display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:10px">
          <div id="prodLista" class="scroll"></div>
          <div id="prodForm" class="card" style="margin:0">
            <label>Nombre</label><input id="prodNombre" style="width:100%" />
            <div class="row" style="margin-top:8px">
              <div><label>Tipo</label>
                <select id="prodTipo"><option value="producto">Producto</option><option value="servicio">Servicio</option></select></div>
              <div><label>Categoría</label><input id="prodCategoria" /></div>
              <div><label>Precio base</label><input id="prodPrecio" type="number" /></div>
              <div><label>Stock</label><input id="prodStock" type="number" /></div>
            </div>
            <p id="prodMsg" class="ok"></p>
            <div class="row" style="justify-content:flex-end"><button id="prodGuardar" class="btn-gold">Guardar</button></div>
            <p class="muted" style="font-size:11px">Variantes y extras se editan en la app (próxima iteración del panel).</p>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTABILIDAD -->
    <section id="contabilidadSection" class="hidden">
      <div class="card">
        <div class="row">
          <div><label>Período</label><input id="cPeriodo" type="month" /></div>
          <div class="tabs" style="margin:0">
            <button class="tab csub active" data-libro="diario">Diario</button>
            <button class="tab csub" data-libro="mayor">Mayor</button>
            <button class="tab csub" data-libro="balance">Balance</button>
            <button class="tab csub" data-libro="flujo">Flujo de Caja</button>
            <button class="tab csub" data-libro="conciliacion">Conciliación</button>
            <button class="tab csub" data-libro="iva">IVA (SII)</button>
            <button class="tab csub" data-libro="manual">Manual</button>
          </div>
          <button id="cExcelBtn" class="btn-ghost">Descargar Excel</button>
        </div>
      </div>
      <div id="cContenido" class="scroll" style="padding:12px"><p class="muted">Cargando…</p></div>
    </section>

    <!-- AUXILIARES -->
    <section id="auxiliaresSection" class="hidden">
      <div class="card">
        <div class="row" style="align-items:end; gap:10px; flex-wrap:wrap">
          <div style="flex:1; min-width:180px">
            <label for="auxGiroInput">Giro de la empresa</label>
            <input id="auxGiroInput" style="width:100%" placeholder="ej. pizzería, ferretería…" />
          </div>
          <button id="auxGuardarGiroBtn" class="btn-gold">Guardar giro</button>
          <button id="auxSembrarBtn" class="btn-ghost">🌱 Sembrar por rubro</button>
        </div>
        <p id="auxGiroMsg" class="muted" style="margin:6px 2px 0"></p>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Agregar insumo</h3>
        <div class="row">
          <div><label>Nombre</label><input id="auxNombre" placeholder="ej. Harina" /></div>
          <div><label>Unidad</label><input id="auxUnidad" placeholder="ej. kg" /></div>
          <button id="auxAgregarBtn" class="btn-gold">Agregar</button>
        </div>
        <p id="auxFormMsg" class="muted" style="margin:6px 2px 0"></p>
      </div>
      <div id="auxConsumo" class="card hidden" style="margin-top:10px"></div>
      <div id="auxContenido" class="scroll" style="padding:12px"><p class="muted">Cargando…</p></div>
    </section>

    <!-- AJUSTES -->
    <section id="settingsSection" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Empresa</h3>
        <div class="row">
          <div><label>Nombre</label><input id="cNombre" /></div>
          <div><label>RUT</label><input id="cRut" /></div>
          <div><label>WhatsApp del dueño</label><input id="cOwnerWa" placeholder="569…" /></div>
          <div><label>Resumen</label>
            <select id="cFreq">
              <option value="diario">Diario</option>
              <option value="semanal">Semanal</option>
              <option value="mensual">Mensual</option>
            </select>
          </div>
          <button id="saveCompanyBtn" class="btn-gold">Guardar</button>
        </div>
        <p id="settingsMsg" class="muted"></p>
      </div>
      <div class="card">
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="ivaIncluido" />
          <span>Mis precios ya incluyen IVA (el pedido muestra el total final, sin sumar 19%)</span>
        </label>
      </div>
      <div class="card">
        <h3 style="margin:0 0 8px;color:var(--gold)">Zonas de despacho</h3>
        <div id="zonasLista" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>
        <div class="row">
          <div><label>Nombre de zona</label><input id="zonaNombre" placeholder="RM cercana" /></div>
          <div><label>Costo</label><input id="zonaCosto" type="number" placeholder="2500" /></div>
          <div style="flex:1"><label>Comunas</label>
            <select id="zonaComunas" multiple size="6" style="width:100%"></select>
          </div>
          <div><button id="zonaAgregar" class="btn-gold btn-sm">+ Zona</button></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label>Envío gratis desde $</label><input id="deliveryGratis" type="number" placeholder="(opcional)" /></div>
          <div><button id="deliveryGuardar" class="btn-gold btn-sm">Guardar envío</button></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="lib.js"></script>
<script>
(function () {
  var TOKEN_KEY = 'atiko_gastos_panel_jwt';
  var CATEGORIES = [
    'Mercadería e insumos del giro','Alimentación y representación','Combustible y transporte',
    'Mantención y reparaciones','Arriendos','Servicios básicos','Útiles de oficina / generales',
    'Seguros','Publicidad y promoción','Honorarios','Contribuciones, patentes e impuestos',
    'Gastos financieros','Otros gastos'
  ];
  var $ = function (id) { return document.getElementById(id); };
  function token() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  async function apiFetch(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    var t = token();
    if (t) headers['Authorization'] = 'Bearer ' + t;
    if (opts.body && !(opts.body instanceof Blob)) headers['Content-Type'] = 'application/json';
    var res = await fetch('/api/panel' + path, { method: opts.method || 'GET', headers: headers, body: opts.body });
    if (res.status === 401) { clearToken(); showLogin(); throw new Error('401'); }
    return res;
  }

  function showLogin() { $('loginView').classList.remove('hidden'); $('appView').classList.add('hidden'); }
  function ymActual() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function showApp() { $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); if (!$('fPeriodo').value) $('fPeriodo').value = ymActual(); loadGastos(); }

  $('loginBtn').onclick = async function () {
    $('loginErr').textContent = '';
    try {
      var res = await fetch('/api/panel/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value, password: $('password').value })
      });
      if (!res.ok) throw new Error('bad');
      var data = await res.json();
      setToken(data.token);
      showApp();
    } catch (e) { $('loginErr').textContent = 'Correo o contraseña incorrectos.'; }
  };
  $('logoutBtn').onclick = function () { clearToken(); showLogin(); };
  $('togglePass').onclick = function () {
    var p = $('password');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('togglePass').textContent = show ? '🙈' : '👁️';
  };

  var tabs = document.querySelectorAll('.tab[data-tab]');
  tabs.forEach(function (b) {
    b.onclick = function () {
      tabs.forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      var tab = b.getAttribute('data-tab');
      $('gastosSection').classList.toggle('hidden', tab !== 'gastos');
      $('employeesSection').classList.toggle('hidden', tab !== 'empleados');
      $('productosSection').classList.toggle('hidden', tab !== 'productos');
      $('settingsSection').classList.toggle('hidden', tab !== 'ajustes');
      $('contabilidadSection').classList.toggle('hidden', tab !== 'contabilidad');
      $('auxiliaresSection').classList.toggle('hidden', tab !== 'auxiliares');
      if (tab === 'empleados') loadEmpleados();
      if (tab === 'ajustes') loadCompany();
      if (tab === 'productos') cargarProductos();
      if (tab === 'contabilidad') { if (!$('cPeriodo').value) $('cPeriodo').value = ymActual(); loadContabilidad(); }
      if (tab === 'auxiliares') loadAuxiliares();
    };
  });

  CATEGORIES.forEach(function (c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c; $('fCategoria').appendChild(o);
  });

  function currentFilters() {
    return { from: $('fFrom').value, to: $('fTo').value, periodo: $('fPeriodo').value,
             tipo: $('fTipo').value, categoria: $('fCategoria').value,
             estado: $('fEstado').value, proveedor: $('fProveedor').value };
  }
  var lastRows = [];
  async function loadGastos() {
    $('expensesTable').innerHTML = '<p class="muted" style="padding:16px">Cargando…</p>';
    try {
      var res = await apiFetch('/expenses' + PanelLib.buildQuery(currentFilters()));
      var rows = await res.json();
      lastRows = rows;
      renderSaldo(rows);
      $('expensesTable').innerHTML = rows.length ? PanelLib.expensesTableHtml(rows)
        : '<p class="muted" style="padding:16px">Sin movimientos para esos filtros.</p>';
      wirePayButtons();
      wireRowClicks();
    } catch (e) { if (e.message !== '401') $('expensesTable').innerHTML = '<p class="err" style="padding:16px">Error al cargar.</p>'; }
  }
  function wireRowClicks() {
    $('expensesTable').querySelectorAll('tr.exp-row').forEach(function (tr) {
      tr.onclick = function (ev) {
        if (ev.target.closest && ev.target.closest('[data-pay]')) return; // no abrir si tocó "Marcar pagada"
        var id = tr.getAttribute('data-id');
        var row = lastRows.filter(function (r) { return String(r.id) === id; })[0];
        if (row) openDetalle(row);
      };
    });
  }
  var detSel = null;
  function openDetalle(row) {
    detSel = row;
    $('detalleTitulo').textContent = (row.tipo === 'ingreso' ? 'Ingreso' : 'Gasto') + ' · ' + PanelLib.fmtClp(row.total);
    $('detalleBody').innerHTML = PanelLib.detalleHtml(row);
    defaultActions();
    $('detalleModal').classList.remove('hidden');
  }
  function closeDetalle() { $('detalleModal').classList.add('hidden'); $('detalleActions').innerHTML = ''; }
  function defaultActions() {
    $('detalleActions').innerHTML = '<button id="detFotoBtn" class="btn-ghost" style="flex:1">📷 Ver foto</button>'
      + '<button id="detEditBtn" class="btn-ghost" style="flex:1">✏️ Editar</button>'
      + '<button id="detAnularBtn" class="btn-ghost" style="flex:1; color:#ff8a8a">🗑️ Anular</button>';
    $('detFotoBtn').onclick = onFoto;
    $('detEditBtn').onclick = onEdit;
    $('detAnularBtn').onclick = onAnular;
  }
  async function onFoto() {
    if (!detSel) return;
    try {
      var res = await apiFetch('/expenses/' + detSel.id + '/foto');
      if (!res.ok) { $('detalleBody').insertAdjacentHTML('afterbegin', '<div class="muted" style="margin-bottom:8px">Sin foto disponible (se guarda 2 meses y luego se elimina).</div>'); $('detFotoBtn').disabled = true; return; }
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      $('detalleBody').insertAdjacentHTML('afterbegin', '<img alt="factura" src="' + url + '" style="width:100%; max-height:340px; object-fit:contain; border-radius:10px; background:#0008; margin-bottom:10px" />');
      $('detFotoBtn').disabled = true;
    } catch (e) {}
  }
  function fld(id, label, value, type) {
    return '<label class="muted" style="display:block; margin-top:8px">' + label + '</label>'
      + '<input id="' + id + '" ' + (type ? 'type="' + type + '" ' : '') + 'style="width:100%" value="' + PanelLib.escapeHtml(value == null ? '' : value) + '" />';
  }
  function onEdit() {
    var e = detSel; if (!e) return;
    var esIngreso = e.tipo === 'ingreso';
    var catOpts = '<option value="">—</option>' + CATEGORIES.map(function (c) {
      return '<option value="' + PanelLib.escapeHtml(c) + '"' + (c === e.categoria ? ' selected' : '') + '>' + PanelLib.escapeHtml(c) + '</option>';
    }).join('');
    $('detalleBody').innerHTML = ''
      + '<label class="muted" style="display:block">Tipo</label>'
      + '<select id="edTipo" style="width:100%"><option value="gasto"' + (esIngreso ? '' : ' selected') + '>Gasto</option><option value="ingreso"' + (esIngreso ? ' selected' : '') + '>Ingreso</option></select>'
      + fld('edProveedor', esIngreso ? 'Pagador / origen' : 'Proveedor', e.proveedor)
      + fld('edTotal', 'Monto', e.total, 'number')
      + fld('edFecha', 'Fecha (aaaa-mm-dd)', e.fecha ? String(e.fecha).slice(0, 10) : '')
      + '<label class="muted" style="display:block; margin-top:8px">Categoría</label><select id="edCategoria" style="width:100%">' + catOpts + '</select>'

  async function getCuentas() {
    if (_cuentasCache) return _cuentasCache;
    try {
      var res = await apiFetch('/cuentas');

  function renderManualForm() {
    var hoy = new Date();
    var fechaHoy = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
    $('cContenido').innerHTML =
      '<div style="max-width:640px;padding:4px">'
      + '<h3 style="color:var(--gold);margin-top:0">Nuevo asiento manual</h3>'
      + '<div class="row" style="margin-bottom:8px">'
      + '<div><label>Fecha</label><input id="mFecha" type="date" value="' + fechaHoy + '" /></div>'
      + '<div style="flex:1"><label>Glosa</label><input id="mGlosa" style="width:100%" placeholder="Descripción del asiento" /></div>'
      + '</div>'
      + '<div id="mFilas"></div>'
      + '<button id="mAddFila" class="btn-ghost" style="margin:6px 0;font-size:12px">+ línea</button>'
      + '<div id="mCuadreIndicator" style="text-align:center;font-weight:900;border-radius:8px;padding:6px;margin:8px 0;font-size:13px"></div>'
      + '<button id="mGuardar" class="btn-gold" style="width:100%" disabled>Guardar asiento</button>'
      + '<p id="mMsg" class="muted" style="text-align:center;margin:6px 0"></p>'
      + '</div>';

    var filas = [{ cuenta_id: '', debe: '', haber: '' }, { cuenta_id: '', debe: '', haber: '' }];

    getCuentas().then(function (cuentas) {
      function cuentaOpts(sel) {
        return '<option value="">cuenta…</option>'
          + cuentas.map(function (c) {
              return '<option value="' + PanelLib.escapeHtml(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>'
                + PanelLib.escapeHtml(c.codigo + ' ' + c.nombre) + '</option>';
            }).join('');
      }

      function actualizarCuadre() {
        var lineas = filas.map(function (f) { return { debe: Number(f.debe) || 0, haber: Number(f.haber) || 0 }; });
        var c = PanelLib.cuadreManual(lineas);
        var ind = $('mCuadreIndicator');
        var btn = $('mGuardar');
        if (!ind || !btn) return;
        ind.textContent = 'Debe $' + c.sumD.toLocaleString('es-CL') + ' · Haber $' + c.sumH.toLocaleString('es-CL') + (c.cuadrado ? ' ✓ cuadra' : ' ⚠ no cuadra');
        ind.style.background = c.cuadrado ? '#1a3a1a' : '#3a1a1a';
        ind.style.color = c.cuadrado ? '#7CFC9B' : '#ff8a8a';
        btn.disabled = !c.cuadrado;
      }

      function renderFilas() {
        var cont = $('mFilas');
        if (!cont) return;
        cont.innerHTML = filas.map(function (f, i) {
          return '<div class="row" style="margin-bottom:4px" data-fila="' + i + '">'
            + '<select data-fc="' + i + '" style="flex:2;min-width:160px">' + cuentaOpts(f.cuenta_id) + '</select>'
            + '<input data-fd="' + i + '" type="number" placeholder="Debe" value="' + PanelLib.escapeHtml(f.debe) + '" style="flex:1;min-width:80px" />'
            + '<input data-fh="' + i + '" type="number" placeholder="Haber" value="' + PanelLib.escapeHtml(f.haber) + '" style="flex:1;min-width:80px" />'
            + '</div>';
        }).join('');
        cont.querySelectorAll('[data-fc]').forEach(function (el) {
          el.onchange = function () { filas[Number(el.dataset.fc)].cuenta_id = el.value; };
        });
        cont.querySelectorAll('[data-fd]').forEach(function (el) {
          el.oninput = function () { filas[Number(el.dataset.fd)].debe = el.value; filas[Number(el.dataset.fd)].haber = ''; actualizarCuadre(); };
        });
        cont.querySelectorAll('[data-fh]').forEach(function (el) {
          el.oninput = function () { filas[Number(el.dataset.fh)].haber = el.value; filas[Number(el.dataset.fh)].debe = ''; actualizarCuadre(); };
        });
        actualizarCuadre();
      }

      renderFilas();

      var addFilaBtn = $('mAddFila');
      if (addFilaBtn) {
        addFilaBtn.onclick = function () {
          filas.push({ cuenta_id: '', debe: '', haber: '' });
          renderFilas();
        };
      }

      var guardarBtn = $('mGuardar');
      if (guardarBtn) {
        guardarBtn.onclick = async function () {
          guardarBtn.disabled = true;
          $('mMsg').textContent = 'Guardando…';
          var lineas = filas
            .filter(function (f) { return f.cuenta_id && (Number(f.debe) > 0 || Number(f.haber) > 0); })
            .map(function (f) { return { cuenta_id: f.cuenta_id, debe: Math.round(Number(f.debe) || 0), haber: Math.round(Number(f.haber) || 0) }; });
          try {
            var res = await apiFetch('/asientos/manual', { method: 'POST', body: JSON.stringify({ fecha: $('mFecha').value, glosa: $('mGlosa').value, lineas: lineas }) });
            if (!res.ok) throw new Error('fail');
            $('mMsg').textContent = '✓ Asiento guardado';
            filas = [{ cuenta_id: '', debe: '', haber: '' }, { cuenta_id: '', debe: '', haber: '' }];
            // Switch back to diario to show the newly created entry
            document.querySelectorAll('.csub').forEach(function (x) { x.classList.remove('active'); });
            document.querySelector('.csub[data-libro="diario"]').classList.add('active');
            libroActual = 'diario';
            loadContabilidad();
          } catch (e) {
            $('mMsg').textContent = 'No se pudo guardar. Verifica que el asiento cuadre.';
            actualizarCuadre();
          }
        };
      }
    });
  }

  async function loadContabilidad() {
    $('cContenido').innerHTML = '<p class="muted" style="padding:8px">Cargando…</p>';
    $('cExcelBtn').classList.toggle('hidden', libroActual === 'conciliacion' || libroActual === 'iva' || libroActual === 'manual');
    var p = '?periodo=' + encodeURIComponent(cPeriodoVal());
    try {
      var res, data;
      if (libroActual === 'manual') {
        renderManualForm();
        return;
      } else if (libroActual === 'diario') {
        res = await apiFetch('/contabilidad/diario' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.diarioTableHtml(data.asientos);
        $('cContenido').querySelectorAll('[data-anular]').forEach(function (btn) {
          btn.onclick = async function () {
            if (!confirm('¿Anular este asiento? (quedará registrado como anulado)')) return;
            btn.disabled = true;
            try {
              var ar = await apiFetch('/asientos/' + btn.getAttribute('data-anular') + '/anular', { method: 'POST', body: JSON.stringify({}) });
              if (!ar.ok) throw new Error('fail');
              loadContabilidad();
            } catch (e) { btn.disabled = false; alert('No se pudo anular.'); }
          };
        });
      } else if (libroActual === 'mayor') {
        res = await apiFetch('/contabilidad/mayor' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.mayorTableHtml(data.cuentas);
      } else if (libroActual === 'balance') {
        res = await apiFetch('/contabilidad/balance' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.balanceTableHtml(data);
      } else if (libroActual === 'conciliacion') {
        res = await apiFetch('/contabilidad/conciliacion');
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.conciliacionHtml(data && data.conciliacion === null ? null : data);
      } else if (libroActual === 'iva') {
        res = await apiFetch('/contabilidad/conciliacion?tipo=sii');
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.ivaResumenHtml(data && data.conciliacion === null ? null : data);
      } else {
        res = await apiFetch('/contabilidad/flujo' + p);
        data = await res.json();
        $('cContenido').innerHTML = PanelLib.flujoTableHtml(data);
      }
    } catch (e) {
      if (e.message !== '401') $('cContenido').innerHTML = '<p class="err" style="padding:8px">No se pudo cargar.</p>';
    }
  }
  document.querySelectorAll('.csub').forEach(function (b) {

      var res = await apiFetch('/auxiliares', { method: 'POST', body: JSON.stringify({ nombre: nombre, unidad_principal: $('auxUnidad').value.trim() || undefined }) });
      if (!res.ok) throw new Error('bad');
      $('auxNombre').value = ''; $('auxUnidad').value = '';
      $('auxFormMsg').textContent = 'Insumo agregado ✓';
      loadAuxiliares();
    } catch (e) { $('auxFormMsg').textContent = 'Error al agregar.'; }
  };

  if (token()) showApp(); else showLogin();
})();
</script>
</body>
</html>
