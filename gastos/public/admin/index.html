<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hash IA — Admin</title>
<style>
  :root { --gold:#C9A24B; --bg:#0E0E0E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#fff; font-family:system-ui,Segoe UI,sans-serif; }
  a { color:var(--gold); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  header.top { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #ffffff1a; }
  .brand { color:var(--gold); font-weight:900; font-size:18px; }
  .brand small { color:#fff; opacity:.5; font-weight:700; font-size:12px; margin-left:6px; }
  button { cursor:pointer; border:0; border-radius:10px; padding:10px 14px; font-weight:800; }
  .btn-gold { background:var(--gold); color:#000; }
  .btn-ghost { background:#ffffff14; color:#fff; }
  .btn-sm { padding:6px 10px; font-size:12px; }
  input, select { background:#ffffff10; color:#fff; border:1px solid #ffffff26; border-radius:10px; padding:9px 11px; }
  label { font-size:12px; opacity:.8; display:block; margin-bottom:3px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .card { background:#ffffff08; border:1px solid #ffffff14; border-radius:14px; padding:14px; margin:12px 0; }
  .card h3 { margin:0 0 10px; color:var(--gold); font-size:15px; }
  table.exp { width:100%; border-collapse:collapse; font-size:13px; }
  table.exp th, table.exp td { text-align:left; padding:9px 10px; border-bottom:1px solid #ffffff12; white-space:nowrap; }
  table.exp th { color:var(--gold); position:sticky; top:0; background:#161616; }
  table.exp td.num, table.exp th.num { text-align:right; }
  .hidden { display:none; }
  .err { color:#ff6b6b; font-size:13px; min-height:18px; }
  .ok { color:#7be07b; font-size:13px; min-height:18px; }
  .muted { opacity:.6; }
  .scroll { overflow:auto; max-height:60vh; border:1px solid #ffffff12; border-radius:12px; }
  .pill { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:900; letter-spacing:.04em; background:#ffffff14; }
  .pill.free { background:#ffffff14; color:#fff; }
  .pill.basico { background:#2b3d5a; color:#cfe0ff; }
  .pill.pyme { background:#3a2f5a; color:#dccfff; }
  .pill.empresa { background:#5a3a2f; color:#ffd9c4; }
  .big { font-size:23px; font-weight:900; color:var(--gold); }
  .modal { position:fixed; inset:0; background:#000000cc; display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.hidden { display:none; }
  .modal .box { background:#161616; border:1px solid #ffffff22; border-radius:14px; max-width:440px; width:100%; max-height:85vh; overflow:auto; padding:18px; }
  /* Fondo shader esmeralda + naranja (mismo motor que el /panel) */
  #heroShader, #heroScrim { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
  #heroShader { display:block; }
  #heroScrim { background:radial-gradient(120% 100% at 50% 0%, rgba(5,10,8,0.04), rgba(5,10,8,0.28) 70%, rgba(5,10,8,0.46)); }
  body.no-webgl { background:linear-gradient(135deg,#064e3b 0%,#0b3b2e 52%,#7c2d12 135%); }
  header.top, .wrap { position:relative; z-index:1; }
  .card { background:rgba(10,16,13,0.55); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); }
  table.exp th { background:rgba(12,20,16,0.92); }
</style>
</head>
<body>
<canvas id="heroShader" aria-hidden="true"></canvas>
<div id="heroScrim" aria-hidden="true"></div>

<!-- LOGIN -->
<div id="loginView" class="wrap" style="max-width:380px;">
  <h1 class="brand" style="font-size:24px; margin-top:48px;">Hash IA <small>Admin</small></h1>
  <p class="muted">Administración de Atiko Digital</p>
  <div class="card">
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" style="width:100%" autocapitalize="none" value="atiko" />
    <label for="password" style="margin-top:10px">Contraseña</label>
    <div style="position:relative">
      <input id="password" type="password" style="width:100%; padding-right:44px" />
      <button type="button" id="togglePass" aria-label="Mostrar clave"
        style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; padding:4px 6px; font-size:18px">👁️</button>
    </div>
    <label for="totp" style="margin-top:10px">Código 2FA <span style="opacity:.6;font-weight:400">(si lo tenés activado)</span></label>
    <input id="totp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 dígitos" style="width:100%" />
    <p id="loginErr" class="err"></p>
    <button id="loginBtn" class="btn-gold" style="width:100%; margin-top:8px">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header class="top">
    <span class="brand">Hash IA <small>Admin · Atiko</small></span>
    <button id="logoutBtn" class="btn-ghost">Salir</button>
  </header>
  <div class="wrap">

    <!-- EQUIPO (ADMINS INDIVIDUALES) -->
    <div class="card">
      <h3>👥 Equipo (admins)</h3>
      <div id="adminsList" style="margin:6px 0 12px">Cargando…</div>
      <div class="row">
        <div><label>Email</label><input id="ad_email" type="email" autocapitalize="none" placeholder="persona@atiko.cl" /></div>
        <div><label>Nombre</label><input id="ad_nombre" placeholder="Nombre" /></div>
        <div><label>Contraseña (mín 8)</label><input id="ad_pass" type="password" placeholder="••••••••" /></div>
        <div style="display:flex; align-items:flex-end"><button id="ad_btn" class="btn-gold">Crear admin</button></div>
      </div>
      <p id="ad_err" class="err"></p>
      <div id="ad_2fa" style="margin-top:10px; border-top:1px solid #2a2a2a; padding-top:10px"></div>
    </div>

    <!-- CREAR CLIENTE -->
    <div class="card">
      <h3>➕ Nuevo cliente</h3>
      <div class="row">
        <div><label>Empresa</label><input id="nc_empresa" placeholder="Pastelería Dulce" /></div>
        <div><label>RUT (opcional)</label><input id="nc_rut" placeholder="76.111.111-1" /></div>
        <div><label>Teléfono contacto</label><input id="nc_telefono" placeholder="+56 9 1234 5678" /></div>
        <div><label>Email contacto</label><input id="nc_email" type="email" autocapitalize="none" placeholder="contacto@empresa.cl" /></div>
        <div><label>Plan</label>
          <select id="nc_plan">
            <option value="free">free</option>
            <option value="basico">basico</option>
            <option value="pyme" selected>pyme</option>
            <option value="empresa">empresa</option>
          </select>
        </div>
        <div><label>Usuario (login dueño)</label><input id="nc_usuario" autocapitalize="none" placeholder="dulce" /></div>
        <div><label>Contraseña</label><input id="nc_password" placeholder="Clave123" /></div>
        <div><button id="nc_btn" class="btn-gold">Crear</button></div>
        <div style="flex-basis:100%">
          <label>Productos</label>
          <div id="nc_productos" class="row" style="gap:14px">
            <label><input type="checkbox" data-prod="hashia"> Hash IA</label>
            <label><input type="checkbox" data-prod="crm"> CRM</label>
            <label><input type="checkbox" data-prod="chat"> Chat</label>
            <label><input type="checkbox" data-prod="pedidos"> Pedidos</label>
          </div>
          <label style="margin-top:8px">Canales (Chat/CRM)</label>
          <div id="nc_canales" class="row" style="gap:14px">
            <label><input type="checkbox" data-canal="whatsapp"> WhatsApp</label>
            <label><input type="checkbox" data-canal="messenger"> Messenger</label>
            <label><input type="checkbox" data-canal="instagram"> Instagram</label>
            <label><input type="checkbox" data-canal="email"> Email</label>
            <label><input type="checkbox" data-canal="telegram"> Telegram</label>
            <label><input type="checkbox" data-canal="web"> Web</label>
            <label><input type="checkbox" data-canal="voz"> Voz</label>
          </div>
          <label style="margin-top:8px"><input type="checkbox" id="burbuja_activa"> Burbuja flotante (Hash IA)</label>
          <input id="burbuja_apps" placeholder="Apps de la burbuja: whatsapp, rappi, banco…" style="width:100%" />
        </div>
      </div>
      <p id="nc_msg" class="ok"></p>
    </div>

    <!-- LISTA -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">📋 Clientes <span id="periodoLbl" class="muted" style="font-weight:600"></span></h3>
        <div style="display:flex; gap:8px">
          <button id="verArchBtn" class="btn-ghost btn-sm">🗄 Ver archivadas</button>
          <button id="refreshBtn" class="btn-ghost btn-sm">↻ Actualizar</button>
        </div>
      </div>
      <div class="scroll" style="margin-top:10px">
        <table class="exp">
          <thead><tr>
            <th>Empresa</th><th>RUT</th><th>Plan</th>
            <th class="num">Empleados</th><th class="num">Mov. del mes</th><th>Productos</th><th>Acciones</th>
          </tr></thead>
          <tbody id="clientesBody"><tr><td colspan="7" class="muted">Cargando…</td></tr></tbody>
        </table>
      </div>
      <p id="listErr" class="err"></p>
    </div>
  </div>
</div>

<!-- MODAL KALY PERSONA -->
<div id="kalyModal" class="modal hidden">
  <div class="box">
    <h3 style="margin:0 0 4px; color:var(--gold)">🧠 Personalidad de KALY</h3>
    <p class="muted" id="km_empresa" style="margin-top:0"></p>
    <label>Nombre de KALY para este cliente</label>
    <input id="km_nombre" autocapitalize="none" style="width:100%" placeholder="KALY" />
    <label style="margin-top:10px">Tono</label>
    <input id="km_tono" style="width:100%" placeholder="amigable, profesional, informal…" />
    <label style="margin-top:10px">Instrucciones adicionales</label>
    <textarea id="km_instrucciones" style="width:100%; background:#ffffff10; color:#fff; border:1px solid #ffffff26; border-radius:10px; padding:9px 11px; resize:vertical; min-height:80px; font-family:inherit"></textarea>
    <p id="km_msg" class="ok"></p>
    <div class="row" style="justify-content:flex-end; margin-top:12px">
      <button id="km_cancel" class="btn-ghost">Cerrar</button>
      <button id="km_save" class="btn-gold">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL FICHA CLIENTE -->
<div id="fichaModal" class="modal hidden">
  <div class="box" style="max-width:680px">
    <h3 style="margin:0 0 8px; color:var(--gold)">👁️ Ficha del cliente</h3>
    <div id="fichaBody" class="muted">Cargando…</div>
    <div class="row" style="justify-content:flex-end; margin-top:12px">
      <button id="ficha_cerrar" class="btn-ghost">Cerrar</button>
    </div>
  </div>
</div>

<!-- MODAL RESET LOGIN -->
<div id="loginModal" class="modal hidden">
  <div class="box">
    <h3 style="margin:0 0 4px; color:var(--gold)">🔑 Login del dueño</h3>
    <p class="muted" id="lm_empresa" style="margin-top:0"></p>
    <label>Usuario</label><input id="lm_usuario" autocapitalize="none" style="width:100%" />
    <label style="margin-top:10px">Nueva contraseña</label><input id="lm_password" style="width:100%" />
    <p id="lm_msg" class="ok"></p>
    <div class="row" style="justify-content:flex-end; margin-top:12px">
      <button id="lm_cancel" class="btn-ghost">Cerrar</button>
      <button id="lm_save" class="btn-gold">Guardar login</button>
    </div>
  </div>
</div>

<script>
const TKEY = 'hashia_admin_jwt';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem(TKEY) || '';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch('/api/admin' + path, { ...opts, headers });
  let body = null; try { body = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((body && body.error) || ('HTTP ' + r.status)); e.status = r.status; e.body = body; throw e; }
  return body;
}

function show(view) {
  $('loginView').classList.toggle('hidden', view !== 'login');
  $('appView').classList.toggle('hidden', view !== 'app');
}

// ---- login ----
$('togglePass').onclick = () => { const p = $('password'); p.type = p.type === 'password' ? 'text' : 'password'; };
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try {
    const r = await api('/login', { method: 'POST', body: JSON.stringify({ usuario: $('usuario').value.trim(), password: $('password').value, totp: ($('totp').value || '').trim() }) });
    token = r.token; localStorage.setItem(TKEY, token);
    show('app'); cargar();
  } catch (e) {
    $('loginErr').textContent = e.status === 401 ? 'Usuario, clave o código 2FA incorrectos' : (e.status === 503 ? 'Admin no configurado en el servidor' : 'Error: ' + e.message);
  }
};
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = () => { token = ''; localStorage.removeItem(TKEY); show('login'); };

// ---- lista de clientes ----
let verArchivadas = false;
const PLANES = ['free', 'basico', 'pyme', 'empresa'];
const PRODUCTOS = ['hashia', 'crm', 'chat', 'pedidos'];
const CANALES = ['whatsapp', 'messenger', 'instagram', 'email', 'telegram', 'web', 'voz'];
function planSelect(id, plan) {
  return '<select data-plan="' + esc(id) + '" class="btn-sm">' +
    PLANES.map(p => '<option value="' + p + '"' + (p === plan ? ' selected' : '') + '>' + p + '</option>').join('') + '</select>';
}
async function cargar() {
  $('listErr').textContent = '';
  cargarAdmins(); render2fa();
  const now = new Date();
  $('periodoLbl').textContent = '(' + now.toLocaleString('es-CL', { month: 'long', year: 'numeric' }) + ')';
  try {
    const cli = await api('/clientes' + (verArchivadas ? '?archivadas=1' : ''));
    const body = $('clientesBody');
    if ($('verArchBtn')) $('verArchBtn').textContent = verArchivadas ? '← Ver activas' : '🗄 Ver archivadas';
    if (!cli.length) { body.innerHTML = '<tr><td colspan="7" class="muted">' + (verArchivadas ? 'No hay empresas archivadas.' : 'Aún no hay clientes. Crea el primero arriba.') + '</td></tr>'; return; }
    body.innerHTML = cli.map(c => (
      '<tr>' +
      '<td><b>' + esc(c.nombre) + '</b>' + (c.contacto ? '<br><span class="muted" style="font-size:11px">' + esc(c.contacto) + '</span>' : '') + '</td>' +
      '<td class="muted">' + esc(c.rut || '—') + '</td>' +
      '<td>' + planSelect(c.id, c.plan) + '</td>' +
      '<td class="num">' + c.empleados + '</td>' +
      '<td class="num"><span class="big" style="font-size:16px">' + c.movimientos + '</span></td>' +
      '<td>' + (c.productos || []).map(p => '<span class="pill">' + esc(p) + '</span>').join(' ') +
        (c.burbuja_activa ? ' <span class="pill" title="Burbuja">🫧</span>' : '') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn-ghost btn-sm" data-login="' + esc(c.id) + '" data-nombre="' + esc(c.nombre) + '">🔑 Login</button> ' +
        '<button class="btn-ghost btn-sm" data-kaly="' + esc(c.id) + '" data-nombre="' + esc(c.nombre) + '">🧠 KALY</button> ' +
        '<button class="btn-ghost btn-sm" data-ficha="' + esc(c.id) + '">👁️ Ver ficha</button> ' +
        '<button class="btn-ghost btn-sm" style="color:' + (verArchivadas ? '#7be07b' : '#ff9f6b') + '" data-archivar="' + esc(c.id) + '" data-nombre="' + esc(c.nombre) + '" data-arch="' + (verArchivadas ? 1 : 0) + '">' + (verArchivadas ? '♻️ Restaurar' : '🗄 Archivar') + '</button>' +
      '</td>' +
      '</tr>'
    )).join('');
    body.querySelectorAll('select[data-plan]').forEach(sel => {
      sel.onchange = async () => {
        try { await api('/clientes/' + sel.dataset.plan + '/plan', { method: 'PATCH', body: JSON.stringify({ plan: sel.value }) }); }
        catch (e) { $('listErr').textContent = 'No se pudo cambiar el plan: ' + e.message; cargar(); }
      };
    });
    body.querySelectorAll('button[data-login]').forEach(btn => {
      btn.onclick = () => openLoginModal(btn.dataset.login, btn.dataset.nombre);
    });
    body.querySelectorAll('button[data-kaly]').forEach(btn => {
      btn.onclick = () => openKalyModal(btn.dataset.kaly, btn.dataset.nombre);
    });
    body.querySelectorAll('button[data-ficha]').forEach(btn => { btn.onclick = () => abrirFicha(btn.dataset.ficha); });
    body.querySelectorAll('button[data-archivar]').forEach(btn => {
      btn.onclick = () => archivarEmpresa(btn.dataset.archivar, btn.dataset.nombre, btn.dataset.arch === '0');
    });
  } catch (e) {
    if (e.status === 401) { $('logoutBtn').click(); return; }
    $('listErr').textContent = 'Error al cargar: ' + e.message;
  }
}
$('refreshBtn').onclick = cargar;
if ($('verArchBtn')) $('verArchBtn').onclick = () => { verArchivadas = !verArchivadas; cargar(); };
async function archivarEmpresa(id, nombre, archivar) {
  const msg = archivar
    ? '¿Archivar la empresa "' + nombre + '"?\n\nSe oculta de la lista pero NO se borra ningún dato; podés restaurarla cuando quieras desde "Ver archivadas".'
    : '¿Restaurar la empresa "' + nombre + '"? Volverá a la lista de activas.';
  if (!confirm(msg)) return;
  try { await api('/clientes/' + id + '/archivar', { method: 'POST', body: JSON.stringify({ archivada: archivar }) }); cargar(); }
  catch (e) { $('listErr').textContent = 'No se pudo ' + (archivar ? 'archivar' : 'restaurar') + ': ' + e.message; }
}

// ---- crear cliente ----
$('nc_btn').onclick = async () => {
  $('nc_msg').textContent = ''; $('nc_msg').className = 'ok';
  const empresa = $('nc_empresa').value.trim();
  if (!empresa) { $('nc_msg').className = 'err'; $('nc_msg').textContent = 'Falta el nombre de la empresa'; return; }
  const selChecked = (q) => Array.from(document.querySelectorAll(q)).filter(c => c.checked).map(c => c.dataset.prod || c.dataset.canal);
  try {
    await api('/clientes', { method: 'POST', body: JSON.stringify({
      nombreEmpresa: empresa, rut: $('nc_rut').value.trim() || undefined, plan: $('nc_plan').value,
      owner_whatsapp: $('nc_telefono').value.trim() || undefined, owner_email: $('nc_email').value.trim() || undefined,
      usuario: $('nc_usuario').value.trim() || undefined, password: $('nc_password').value || undefined,
      productos: selChecked('#nc_productos input'),
      canales: selChecked('#nc_canales input'),
      burbuja_activa: $('burbuja_activa').checked,
      burbuja_apps: $('burbuja_apps').value.split(',').map(s => s.trim()).filter(Boolean),
    }) });
    $('nc_msg').textContent = '✓ Cliente "' + empresa + '" creado';
    ['nc_empresa', 'nc_rut', 'nc_telefono', 'nc_email', 'nc_usuario', 'nc_password', 'burbuja_apps'].forEach(id => $(id).value = '');
    document.querySelectorAll('#nc_productos input, #nc_canales input').forEach(c => c.checked = false);
    $('burbuja_activa').checked = false;
    $('nc_plan').value = 'pyme';
    cargar();
  } catch (e) { $('nc_msg').className = 'err'; $('nc_msg').textContent = 'Error: ' + e.message; }
};

// ---- modal reset login ----
let lm_id = null;
function openLoginModal(id, nombre) {
  lm_id = id;
  $('lm_empresa').textContent = nombre;
  $('lm_usuario').value = ''; $('lm_password').value = ''; $('lm_msg').textContent = ''; $('lm_msg').className = 'ok';
  $('loginModal').classList.remove('hidden');
}
$('lm_cancel').onclick = () => $('loginModal').classList.add('hidden');
$('lm_save').onclick = async () => {
  $('lm_msg').textContent = ''; $('lm_msg').className = 'ok';
  const usuario = $('lm_usuario').value.trim(), password = $('lm_password').value;
  if (!usuario || !password) { $('lm_msg').className = 'err'; $('lm_msg').textContent = 'Usuario y contraseña son obligatorios'; return; }
  try {
    await api('/clientes/' + lm_id + '/login', { method: 'POST', body: JSON.stringify({ usuario, password }) });
    $('lm_msg').textContent = '✓ Login guardado para "' + usuario + '"';
    setTimeout(() => { $('loginModal').classList.add('hidden'); cargar(); }, 900);
  } catch (e) { $('lm_msg').className = 'err'; $('lm_msg').textContent = 'Error: ' + e.message; }
};

// ---- modal kaly persona ----
let km_id = null;
function openKalyModal(id, nombre) {
  km_id = id;
  $('km_empresa').textContent = nombre;
  $('km_nombre').value = ''; $('km_tono').value = ''; $('km_instrucciones').value = '';
  $('km_msg').textContent = ''; $('km_msg').className = 'ok';
  $('kalyModal').classList.remove('hidden');
}
$('km_cancel').onclick = () => $('kalyModal').classList.add('hidden');
$('km_save').onclick = async () => {
  $('km_msg').textContent = ''; $('km_msg').className = 'ok';
  const nombre = $('km_nombre').value.trim();
  const tono = $('km_tono').value.trim();
  const instrucciones = $('km_instrucciones').value.trim();
  if (!nombre && !tono && !instrucciones) {
    $('km_msg').className = 'err'; $('km_msg').textContent = 'Completa al menos un campo'; return;
  }
  try {
    await api('/clientes/' + km_id + '/kaly-persona', { method: 'PATCH', body: JSON.stringify({ nombre, tono, instrucciones }) });
    $('km_msg').textContent = '✓ Personalidad de KALY guardada';
    setTimeout(() => $('kalyModal').classList.add('hidden'), 1000);
  } catch (e) { $('km_msg').className = 'err'; $('km_msg').textContent = 'Error: ' + e.message; }
};

// ---- ficha del cliente ----
function fmtCLP(n){ return '$' + Number(n||0).toLocaleString('es-CL'); }
async function abrirFicha(id) {
  $('fichaModal').classList.remove('hidden');
  $('fichaBody').innerHTML = 'Cargando…';
  try {
    const f = await api('/clientes/' + id);
    const e = f.empresa;
    const emp = (f.empleados || []).map(x => esc(x.nombre) + ' · ' + esc(x.phone || 's/tel') + ' · ' + esc(x.rol)).join('<br>') || '—';
    const movs = (f.movimientos || []).map(m => esc(m.fecha || '') + ' · ' + esc(m.proveedor || '') + ' · ' + fmtCLP(m.total) + ' · ' + esc(m.estado_pago || '')).join('<br>') || '—';
    const ped = f.pedidos ? (f.pedidos.length + ' pedidos') : 'sin módulo';
    const con = f.conciliacion ? (f.conciliacion.cuadrado ? 'cuadrada' : 'descuadrada') : 'sin conciliación';
    const resu = f.resumen || {};
    const chk = (kind, val, arr) => '<label><input type="checkbox" data-' + kind + '="' + esc(val) + '"' + ((arr || []).includes(val) ? ' checked' : '') + '> ' + esc(val) + '</label>';
    $('fichaBody').innerHTML =
      '<div class="card"><h3>Empresa</h3>' + esc(e.nombre) + ' · ' + esc(e.rut || '—') + ' · ' + esc(e.giro || '—') +
      '<br>Teléfono: ' + esc(e.owner_whatsapp || '—') + ' · Email: ' + esc(e.owner_email || '—') +
      '<br>Plan: ' + esc(e.plan) + '</div>' +
      '<div class="card"><h3>Empleados</h3>' + emp + '</div>' +
      '<div class="card"><h3>Resumen del mes</h3>Ingresos ' + fmtCLP(resu.ingresos) + ' · Gastos ' + fmtCLP(resu.gastos) + ' · Saldo ' + fmtCLP(resu.saldo) + ' · Conciliación ' + con + '</div>' +
      '<div class="card"><h3>Movimientos recientes</h3>' + movs + '</div>' +
      '<div class="card"><h3>Pedidos</h3>' + esc(ped) + '</div>' +
      '<div class="card"><h3>Editar productos y contacto</h3>' +
        '<div class="row" style="gap:10px">' +
          '<div style="flex:1"><label>Nombre contacto</label><input id="fe_nombre" style="width:100%" value="' + esc(e.owner_nombre || '') + '"></div>' +
          '<div style="flex:1"><label>Teléfono</label><input id="fe_telefono" style="width:100%" value="' + esc(e.owner_whatsapp || '') + '"></div>' +
          '<div style="flex:1"><label>Email</label><input id="fe_email" style="width:100%" value="' + esc(e.owner_email || '') + '"></div>' +
        '</div>' +
        '<label style="margin-top:8px">Productos</label><div id="fe_productos" class="row" style="gap:12px">' + PRODUCTOS.map(p => chk('prod', p, e.productos)).join('') + '</div>' +
        '<label style="margin-top:6px">Canales (Chat/CRM)</label><div id="fe_canales" class="row" style="gap:12px">' + CANALES.map(c => chk('canal', c, e.canales)).join('') + '</div>' +
        '<label style="margin-top:6px"><input type="checkbox" id="fe_burbuja"' + (e.burbuja_activa ? ' checked' : '') + '> Burbuja flotante</label>' +
        '<input id="fe_burbuja_apps" style="width:100%" value="' + esc((e.burbuja_apps || []).join(', ')) + '" placeholder="apps de la burbuja: whatsapp, rappi, banco…">' +
        '<div class="row" style="justify-content:flex-end; margin-top:8px; align-items:center; gap:10px"><span id="fe_msg" class="ok"></span><button id="ficha_guardar" class="btn-gold btn-sm">Guardar productos</button></div>' +
      '</div>';
    $('ficha_guardar').onclick = () => guardarProductos(id);
  } catch (err) { $('fichaBody').innerHTML = 'Error: ' + esc(err.message); }
}
$('ficha_cerrar').onclick = () => $('fichaModal').classList.add('hidden');

// ---- agregar / quitar productos a un cliente existente ----
async function guardarProductos(id) {
  const sel = (q) => Array.from(document.querySelectorAll(q)).filter(c => c.checked).map(c => c.dataset.prod || c.dataset.canal);
  $('fe_msg').className = 'ok'; $('fe_msg').textContent = '';
  try {
    await api('/clientes/' + id + '/productos', { method: 'PATCH', body: JSON.stringify({
      productos: sel('#fe_productos input'),
      canales: sel('#fe_canales input'),
      burbuja_activa: $('fe_burbuja').checked,
      burbuja_apps: $('fe_burbuja_apps').value.split(',').map(s => s.trim()).filter(Boolean),
      owner_nombre: $('fe_nombre').value.trim(),
      owner_whatsapp: $('fe_telefono').value.trim(),
      owner_email: $('fe_email').value.trim(),
    }) });
    $('fe_msg').textContent = '✓ Guardado';
    cargar();
  } catch (e) { $('fe_msg').className = 'err'; $('fe_msg').textContent = 'Error: ' + e.message; }
}

// ---- Equipo (admins individuales) ----
function escA(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function cargarAdmins() {
  if (!$('adminsList')) return;
  try {
    const r = await api('/admins');
    const list = r.admins || [];
    $('adminsList').innerHTML = list.length ? list.map(a =>
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1e1e1e">'
      + '<span>' + escA(a.email) + (a.nombre ? ' · ' + escA(a.nombre) : '') + (a.tiene_2fa ? ' 🔐' : '') + (a.activo ? '' : ' <span style="opacity:.5">(inactivo)</span>') + '</span>'
      + '<button data-toggle="' + escA(a.id) + '" data-activo="' + (a.activo ? 1 : 0) + '" style="font-size:12px;padding:2px 8px">' + (a.activo ? 'Desactivar' : 'Activar') + '</button>'
      + '</div>').join('') : '<span style="opacity:.6">Sin admins individuales todavía.</span>';
    $('adminsList').querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
      try { await api('/admins/' + b.dataset.toggle + '/activo', { method: 'PATCH', body: JSON.stringify({ activo: b.dataset.activo === '0' }) }); cargarAdmins(); } catch (e) {}
    });
  } catch (e) { $('adminsList').textContent = 'No se pudo cargar.'; }
}
if ($('ad_btn')) $('ad_btn').onclick = async () => {
  $('ad_err').textContent = '';
  try {
    await api('/admins', { method: 'POST', body: JSON.stringify({ email: $('ad_email').value.trim(), nombre: $('ad_nombre').value.trim(), password: $('ad_pass').value }) });
    $('ad_email').value = ''; $('ad_nombre').value = ''; $('ad_pass').value = '';
    cargarAdmins();
  } catch (e) { $('ad_err').textContent = e.status === 409 ? 'Ya existe un admin con ese email' : (e.status === 400 ? 'Email y contraseña (mín 8) requeridos' : 'Error: ' + e.message); }
};
function render2fa() {
  const box = $('ad_2fa'); if (!box) return;
  box.innerHTML = '<button id="ad_2fa_start" class="btn-gold" style="font-size:13px">🔐 Activar mi 2FA</button>';
  $('ad_2fa_start').onclick = async () => {
    try {
      const s = await api('/2fa/setup', { method: 'POST', body: '{}' });
      box.innerHTML =
        '<div style="font-size:13px">1) Agregá esta clave en Google Authenticator (entrada manual):<br><b style="font-family:monospace;letter-spacing:1px">' + escA(s.secret) + '</b></div>'
        + '<div style="margin:8px 0"><label>2) Código de 6 dígitos</label><input id="ad_2fa_code" maxlength="6" inputmode="numeric" placeholder="123456" /></div>'
        + '<button id="ad_2fa_confirm" class="btn-gold" style="font-size:13px">Confirmar y activar</button> <span id="ad_2fa_msg" style="margin-left:8px"></span>';
      $('ad_2fa_confirm').onclick = async () => {
        try { await api('/2fa/activar', { method: 'POST', body: JSON.stringify({ secret: s.secret, code: ($('ad_2fa_code').value || '').trim() }) }); $('ad_2fa_msg').textContent = '✅ 2FA activado'; cargarAdmins(); }
        catch (e) { $('ad_2fa_msg').textContent = '❌ Código inválido'; }
      };
    } catch (e) {
      box.innerHTML = '<span style="opacity:.6;font-size:13px">El admin "root" (por variables de entorno) configura su 2FA con GASTOS_ADMIN_TOTP_SECRET en el servidor.</span>';
    }
  };
}

// init
if (token) { show('app'); cargar(); } else { show('login'); }
</script>
<script>
/* Fondo shader WebGL — esmeralda + naranja (mismo motor que el /panel). Sin deps. */
(function () {
  var canvas = document.getElementById('heroShader');
  if (!canvas) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gl = null;
  try { gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl'); } catch (e) { gl = null; }
  if (!gl) { document.body.classList.add('no-webgl'); canvas.style.display = 'none'; return; }
  var VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  var FS = [
    'precision highp float;',
    'uniform float u_time; uniform vec2 u_res;',
    'const vec3 C1 = vec3(0.063,0.725,0.506);', // esmeralda brillante #10b981
    'const vec3 C2 = vec3(0.020,0.588,0.412);', // esmeralda medio   #059669
    'const vec3 C3 = vec3(0.024,0.306,0.231);', // esmeralda profundo #064e3b
    'const vec3 C4 = vec3(0.976,0.451,0.086);', // naranja            #f97316
    'void main(){',
    '  vec2 uv = gl_FragCoord.xy / u_res.xy;',
    '  float ar = u_res.x / u_res.y;',
    '  vec2 p = vec2(uv.x * ar, uv.y);',
    '  float t = u_time * 0.28;',
    '  vec2 q = p;',
    '  q += 0.38 * vec2(sin(p.y * 3.0 + t), cos(p.x * 3.0 - t * 0.8));',
    '  q += 0.22 * vec2(cos(p.y * 5.0 - t * 1.3), sin(p.x * 4.0 + t * 1.1));',
    '  float a = 0.5 + 0.5 * sin(q.x * 1.5 + t * 1.10);',
    '  float b = 0.5 + 0.5 * sin(q.y * 1.7 - t * 0.90 + 1.6);',
    '  float c = 0.5 + 0.5 * sin((q.x + q.y) * 1.2 + t * 0.70);',
    '  float o = 0.5 + 0.5 * sin(q.x * 1.05 - q.y * 1.35 + t * 1.30);',
    '  vec3 col = mix(C3, C2, smoothstep(0.0, 1.0, a));',
    '  col = mix(col, C1, smoothstep(0.28, 1.0, b) * 0.95);',
    '  col = mix(col, C1, smoothstep(0.45, 1.0, c) * 0.55);',
    '  col = mix(col, C4, smoothstep(0.60, 1.02, o) * 0.78);',
    '  col += 0.05;',
    '  col = pow(col, vec3(0.78));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');
  function compile(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader'); return s; }
  var prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'link');
  } catch (e) { document.body.classList.add('no-webgl'); canvas.style.display = 'none'; return; }
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uRes = gl.getUniformLocation(prog, 'u_res');
  function resize() { var dpr = Math.min(window.devicePixelRatio || 1, 2); var w = Math.floor(window.innerWidth * dpr), h = Math.floor(window.innerHeight * dpr); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); } }
  window.addEventListener('resize', resize); resize();
  function draw(time) { gl.uniform1f(uTime, time); gl.uniform2f(uRes, canvas.width, canvas.height); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  var raf = null, t0 = Date.now();
  function frame() { resize(); draw((Date.now() - t0) / 1000); raf = requestAnimationFrame(frame); }
  function start() { if (!raf) raf = requestAnimationFrame(frame); }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });
  if (reduce) { resize(); draw(4.0); } else { start(); }
})();
</script>
